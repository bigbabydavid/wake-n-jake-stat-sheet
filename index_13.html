  'Philadelphia Phillies':'Phillies','Pittsburgh Pirates':'Pirates','San Diego Padres':'Padres',
  'San Francisco Giants':'Giants','Seattle Mariners':'Mariners','St. Louis Cardinals':'Cardinals',
  'Tampa Bay Rays':'Rays','Texas Rangers':'Rangers','Toronto Blue Jays':'Blue Jays',
  'Washington Nationals':'Nationals',
};
const nickOf = name => TEAM_NICKNAME[name] || name;

// ---- Lefty/righty side-by-side comparison -------------------------------------------------
// Pitchers' "vs a hand" numbers are against-stats (AVG allowed, batters faced), so the same
// shape reads correctly for both sides of the ball.
async function buildLRCompareData(pid, row, tier) {
  const isPitcher = wantsPitching(row) && !wantsBatting(row);
  const group = isPitcher ? 'pitching' : 'hitting';
  const statType = tier === 'career' ? 'careerStatSplits' : 'statSplits';
  const seasonParam = tier === 'career' ? '' : `&season=${$('season').value}`;
  const pull = async sit => {
    const d = await jc(`${API}/people/${pid}/stats?stats=${statType}&sitCodes=${sit}&group=${group}${seasonParam}&sportId=1`).catch(() => null);
    const sec = d && (d.stats || [])[0];
    return sec && sec.splits && sec.splits.length ? sec.splits[0].stat : null;
  };
  const [vl, vr] = await Promise.all([pull('vl'), pull('vr')]);
  if (!vl && !vr) return null;
  const DASH = '\u2014';
  const extract = st => ({
    pa: st ? (isPitcher ? st.battersFaced : st.plateAppearances) || 0 : 0,
    avg: st ? st.avg : DASH,
    ops: st ? (isPitcher ? st.whip : st.ops) : DASH,
    hr: st ? (st.homeRuns != null ? st.homeRuns : DASH) : DASH,
  });
  const tierLabel = tier === 'career' ? 'CAREER' : `${$('season').value} SEASON`;
  const label = `${tierLabel} \u00b7 LEFTY/RIGHTY SPLIT`;
  return {
    label, splitLabel: label, splitCompare: true, isPitcher,
    left: { label: isPitcher ? 'vs. LHB' : 'vs. LHP', ...extract(vl) },
    right: { label: isPitcher ? 'vs. RHB' : 'vs. RHP', ...extract(vr) },
  };
}

// ---- Career vs. a specific opponent -------------------------------------------------------
async function buildMatchupData(pid, row, oppId, oppName) {
  const isPitcher = wantsPitching(row) && !wantsBatting(row);
  const group = isPitcher ? 'pitching' : 'hitting';
  const d = await jc(`${API}/people/${pid}/stats?stats=vsPlayer&opposingPlayerId=${oppId}&group=${group}&sportId=1`);
  const sec = (d.stats || [])[0];
  const st = sec && sec.splits && sec.splits.length ? sec.splits[0].stat : null;
  if (!st) return null;
  const label = `CAREER VS. ${oppName.toUpperCase()}`;
  if (!isPitcher) {
    // raw K/BB counts beat rates at matchup sample sizes — "3 K" reads better than "33%"
    return { label, splitLabel: label, hitLine: `${st.hits}-for-${st.atBats}`, cells: [
      ['AVG', st.avg], ['OBP', st.obp], ['SLG', st.slg], ['OPS', st.ops],
      ['K', +st.strikeOuts || 0], ['BB', +st.baseOnBalls || 0], ['HR', +st.homeRuns || 0]] };
  }
  return { label, splitLabel: label, hitLine: `${st.hits}-for-${st.atBats} allowed`, cells: [
    ['IP', st.inningsPitched], ['H', st.hits], ['BB', st.baseOnBalls],
    ['K', st.strikeOuts], ['HR', st.homeRuns], ['AVG', st.avg]] };
}

// ---- Notable rankings ---------------------------------------------------------------------
// Categories confirmed against the live leaders endpoint. MLB-wide is checked first (the better
// framing); AL/NL only matter when the MLB-wide rank isn't notable.
const RANK_CATEGORIES_BAT = [
  ['homeRuns', 'Home Runs'], ['runsBattedIn', 'RBI'], ['battingAverage', 'AVG'],
  ['onBasePercentage', 'OBP'], ['sluggingPercentage', 'SLG'], ['onBasePlusSlugging', 'OPS'],
  ['runs', 'Runs'], ['stolenBases', 'Stolen Bases'],
];
const RANK_CATEGORIES_PIT = [
  ['era', 'ERA'], ['whip', 'WHIP'], ['wins', 'Wins'], ['saves', 'Saves'], ['strikeouts', 'Strikeouts'],
];
const RANK_NOTABLE_MAX = 10;

function ordinal(n) {
  const suf = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (suf[(v - 20) % 10] || suf[v] || suf[0]);
}

// limit=15 is deliberate: we only care whether they placed top 10, so there's no reason to page
// further to pin down an exact rank they don't have.
async function findPlayerRank(pid, category, group, leagueId) {
  const url = `${API}/stats/leaders?leaderCategories=${category}&season=${$('season').value}` +
    `&sportId=1&statGroup=${group}&limit=15${leagueId ? `&leagueId=${leagueId}` : ''}`;
  const d = await j(url).catch(() => null);
  const cat = d && d.leagueLeaders && d.leagueLeaders[0];
  const hit = cat && (cat.leaders || []).find(l => String(l.person.id) === String(pid));
  return hit ? { rank: hit.rank, value: hit.value } : null;
}

async function findNotableRankings(pid, isPitcher) {
  const categories = isPitcher ? RANK_CATEGORIES_PIT : RANK_CATEGORIES_BAT;
  const group = isPitcher ? 'pitching' : 'hitting';
  const results = await Promise.all(categories.map(async ([cat, label]) => {
    const [mlb, al, nl] = await Promise.all([
      findPlayerRank(pid, cat, group, null),
      findPlayerRank(pid, cat, group, 103),
      findPlayerRank(pid, cat, group, 104),
    ]);
    const hits = [];
    if (mlb && mlb.rank <= RANK_NOTABLE_MAX) hits.push({ scope: 'MLB', label, rank: mlb.rank, value: mlb.value });
    else {
      if (al && al.rank <= RANK_NOTABLE_MAX) hits.push({ scope: 'AL', label, rank: al.rank, value: al.value });
      if (nl && nl.rank <= RANK_NOTABLE_MAX) hits.push({ scope: 'NL', label, rank: nl.rank, value: nl.value });
    }
    return hits;
  }));
  return results.flat().sort((a, b) => a.rank - b.rank).slice(0, 12);
}

function buildRankGraphicData(r) {
  const ord = ordinal(r.rank);
  const words = `IN ${r.scope} IN ${r.label} (${r.value})`;
  return { label: `${ord} in ${r.scope} in ${r.label} (${r.value})`, splitLabel: '',
           sentenceMode: true, cells: [[words, ord.toUpperCase()]] };
}

// ---- Team tenure --------------------------------------------------------------------------
// Career totals split by each club the player has appeared for, summed from year-by-year.
async function fetchTeamTenure(pid, group) {
  const d = await jc(`${API}/people/${pid}/stats?stats=yearByYear&group=${group}&sportId=1`).catch(() => null);
  const splits = (d && (d.stats || [])[0] && d.stats[0].splits) || [];
  const byTeam = new Map();
  splits.forEach(sp => {
    const t = sp.team; if (!t || !t.name) return;
    if (!byTeam.has(t.name)) byTeam.set(t.name, []);
    byTeam.get(t.name).push(sp.stat);
  });
  return [...byTeam.entries()].map(([name, parts]) => ({ name, stat: aggregateFor(group, parts) }))
    .filter(x => x.stat);
}

async function fetchScopedStat(pid, group, tf) {
  // these define their own scope, so the season chips / since-date don't apply to them
  if (isCareerTf(tf)) return fetchStat(pid, group, 'career', $('season').value).catch(() => null);
  if (isCareerSplit(tf)) return fetchCareerSplit(pid, group, tf).catch(() => null);
  if (isLastXTf(tf)) return fetchLastX(pid, group, +tf.split(':')[1]).catch(() => null);
  if (isRangeTf(tf)) { const [, f, t] = tf.split(':'); return fetchRange(pid, group, f, t).catch(() => null); }
  if (modalSince) return fetchSince(pid, group, modalSince);
  const years = modalSeasons.size ? [...modalSeasons] : [$('season').value];
  const parts = await Promise.all(years.map(y => fetchStat(pid, group, tf, y).catch(() => null)));
  return aggregateFor(group, parts);
}

function scopeLabel() {
  if (modalSince) return `SINCE ${modalSince}`;
  const years = [...modalSeasons].sort();
  if (!years.length) return String($('season').value);
  if (years.length === 1) return years[0];
  // consecutive runs read better as a range than a long list
  const consecutive = years.every((y, i) => i === 0 || +y === +years[i - 1] + 1);
  return consecutive ? `${years[0]}\u2013${years[years.length - 1]}` : years.join(', ');
}

// Label shown on the graphic: scope first, then the split (unless the split IS the whole season).
function scopedSplitLabel(tf, group) {
  if (isCareerTf(tf)) return 'CAREER';
  if (isCareerSplit(tf)) return CAREER_SPLIT_NAME[tf];
  if (isLastXTf(tf)) return `LAST ${tf.split(':')[1]} GAMES`;
  if (isRangeTf(tf)) { const [, f, t] = tf.split(':'); return `${f} \u2192 ${t}`; }
  const scope = scopeLabel();
  if (tf === 'season') return scope;
  return `${scope} \u00b7 ${tfLabel(tf, scope, group)}`;
}

function paintSeasonPicker() {
  const box = $('seasonPicker');
  if (!box) return;
  const chips = modalSeasonList.map(y =>
    `<button type="button" class="tf-pill${modalSeasons.has(y) && !modalSince ? ' on' : ''}" data-year="${y}">${y}</button>`
  ).join('');
  const today = new Date().toISOString().slice(0, 10);
  box.innerHTML =
    `<div class="scope-row">${chips || '<span class="modal-empty">No season history found.</span>'}</div>` +
    `<div class="scope-row scope-since">
       <label for="rangeFrom">Date range</label>
       <input type="date" id="rangeFrom" max="${today}" value="${modalRangeFrom}">
       <span class="modal-empty">to</span>
       <input type="date" id="rangeTo" max="${today}" value="${modalRangeTo || today}">
       <button type="button" class="tf-pill" id="rangeApply">Apply</button>
       <button type="button" class="tf-pill" id="scopeClear">Reset</button>
     </div>` +
    `<div class="scope-row scope-since">
       <label for="lastXInput">Last</label>
       <input type="number" id="lastXInput" min="1" max="200" value="${modalLastX || 10}" style="width:74px">
       <span class="modal-empty">games</span>
       <button type="button" class="tf-pill" id="lastXApply">Apply</button>
       <span class="modal-empty" id="scopeNote">Showing: ${scopeLabel()}</span>
     </div>`;
  box.querySelectorAll('button[data-year]').forEach(b => {
    b.onclick = () => {
      modalSince = '';
      const y = b.dataset.year;
      if (modalSeasons.has(y)) modalSeasons.delete(y); else modalSeasons.add(y);
      if (!modalSeasons.size) modalSeasons.add(y);   // never leave the scope empty
      paintSeasonPicker(); loadModalStats();
    };
  });
  const note = $('modalDlNote');
  const rangeBtn = box.querySelector('#rangeApply');
  if (rangeBtn) rangeBtn.onclick = () => {
    const from = box.querySelector('#rangeFrom').value, to = box.querySelector('#rangeTo').value;
    if (!from || !to) { note.textContent = 'Pick both a start and an end date.'; return; }
    if (from > to) { note.textContent = 'Start date must come before the end date.'; return; }
    note.textContent = '';
    modalRangeFrom = from; modalRangeTo = to; modalSince = '';
    modalTf = `range:${from}:${to}`;
    paintSeasonPicker(); paintTfPills(); loadModalStats();
  };
  const lastXBtn = box.querySelector('#lastXApply');
  if (lastXBtn) lastXBtn.onclick = () => {
    const n = +box.querySelector('#lastXInput').value;
    if (!n || n < 1) { note.textContent = 'Enter a number of games, 1 or more.'; return; }
    note.textContent = '';
    modalLastX = n; modalSince = '';
    modalTf = `lastx:${n}`;
    paintSeasonPicker(); paintTfPills(); loadModalStats();
  };
  const clearBtn = box.querySelector('#scopeClear');
  if (clearBtn) clearBtn.onclick = () => {
    modalSince = ''; modalRangeFrom = ''; modalRangeTo = ''; modalLastX = 0;
    modalTf = 'season';
    modalSeasons = new Set([String($('season').value)]);
    note.textContent = '';
    paintSeasonPicker(); paintTfPills(); loadModalStats();
  };
}

async function openPlayerModal(pid) {
  const row = currentIndex.get(String(pid));
  if (!row) return;
  modalPid = pid; modalRow = row; modalTf = 'season';
  modalSince = ''; modalRangeFrom = ''; modalRangeTo = ''; modalLastX = 0;
  modalSeasons = new Set([String($('season').value)]);
  modalSeasonList = [];
  $('modalDlNote').textContent = '';
  $('modalHeadshot').src = headshotURL(pid);
  $('modalName').textContent = row.name;
  $('modalSub').textContent = [row.pos, row.team].filter(Boolean).join(' · ');
  $('modalBackdrop').hidden = false;
  // size the preview stage now that the modal has a width, then show current on-air state
  requestAnimationFrame(() => { const pv = previewRoot(); if (pv) fitPreviewStage(pv); });
  $('rankRow').hidden = true; $('rankRow').innerHTML = '';
  $('teamRow').innerHTML = '';
  paintSeasonPicker();
  paintTfPills();
  wireModalExtras();
  await loadModalStats();
  // season history is only needed for the picker, so it loads alongside rather than blocking stats
  const groups = [wantsBatting(row) ? 'hitting' : null, wantsPitching(row) ? 'pitching' : null].filter(Boolean);
  const list = await fetchSeasonList(pid, groups);
  if (modalPid !== pid) return;
  modalSeasonList = list.length ? list : [String($('season').value)];
  paintSeasonPicker();
}

function paintTfPills() {
  const box = $('tfPills'); box.innerHTML = '';
  const add = (key, label) => {
    const b = el('button', 'tf-pill' + (key === modalTf ? ' on' : ''), label);
    b.type = 'button';
    b.onclick = () => {
      modalTf = key; modalSince = '';
      paintSeasonPicker(); paintTfPills(); loadModalStats();
    };
    box.appendChild(b);
  };
  TF.forEach(([key, label]) => add(key, label));
  CAREER_SPLITS.forEach(([key, label]) => add(key, label));
}

async function loadModalStats() {
  const pid = modalPid, row = modalRow, tf = modalTf, scopeAtStart = scopeLabel();
  $('modalBody').innerHTML = `<div class="modal-empty">Loading ${scopeAtStart}…</div>`;
  const doBat = wantsBatting(row), doPit = wantsPitching(row);
  const [bat, pit] = await Promise.all([
    doBat ? fetchScopedStat(pid, 'hitting', tf).catch(() => null) : Promise.resolve(null),
    doPit ? fetchScopedStat(pid, 'pitching', tf).catch(() => null) : Promise.resolve(null),
  ]);
  // selection or scope changed while this was in flight — let the newer request win
  if (modalPid !== pid || modalTf !== tf || scopeLabel() !== scopeAtStart) return;
  modalBat = bat; modalPit = pit;

  // phrase used in the one-stat sentence, e.g. "9 HOME RUNS THIS SEASON" / "... IN HIS CAREER"
  const isPlainCurrentSeason = tf === 'season' && !modalSince && modalSeasons.size === 1
    && [...modalSeasons][0] === String($('season').value);
  const srcPhrase = (isCareerTf(tf) || isCareerSplit(tf)) ? 'in his career'
    : isPlainCurrentSeason ? 'this season'
    : scopedSplitLabel(tf, doPit && !doBat ? 'pitching' : 'hitting').toLowerCase();

  const parts = [];
  if (doBat) parts.push([`${scopedSplitLabel(tf, 'hitting')} · Hitting`, apiBattingBlock(bat, srcPhrase)]);
  if (doPit) parts.push([`${scopedSplitLabel(tf, 'pitching')} · Pitching`, isSplitTf(tf) ? apiPitchingSplitBlock(pit, srcPhrase) : apiPitchingBlock(pit, srcPhrase)]);
  $('modalBody').innerHTML = parts.length
    ? parts.map(([t, html]) => `<div class="modal-section"><h3>${t}</h3>${html}</div>`).join('')
    : `<div class="modal-empty">No stats available for this range.</div>`;

  $('modalDownloadBat').hidden = !(bat && +bat.atBats > 0);
  $('modalDownloadPit').hidden = !(pit && (+pit.outs > 0 || +pit.battersFaced > 0 || +pit.gamesPlayed > 0));

  autoPushOnAir();
}

// Clicking any stat tile (or a value in the slash line) swaps the graphic to a single-stat
// sentence. Clicking a split button afterwards goes back to the full stat line, so this is a
// detour rather than a mode you have to get out of.
$('modalBody').onclick = e => {
  const cell = e.target.closest('.cell-clickable');
  if (!cell || !modalPid || !modalRow) return;
  const key = `stat:${cell.dataset.source}:${cell.dataset.label}:${cell.dataset.value}`;
  const data = buildStatTileGraphicData(key);
  if (!data) return;
  $('modalBody').querySelectorAll('.cell-clickable.on').forEach(x => x.classList.remove('on'));
  pushOnAir(modalPid, cell.dataset.group === 'pitching' ? 'pit' : 'bat', modalRow, data);
  $('modalDlNote').textContent = `On air: ${data.label}`;
};

// ---- extras: L/R compare, notable rankings, team tenure, opponent matchup -------------------
// These all bypass the split/season scope entirely — each defines its own — so they push directly
// rather than routing through loadModalStats.
function pushCustomGraphic(data, kindHint) {
  if (!data || !modalPid || !modalRow) return;
  pushOnAir(modalPid, kindHint || 'bat', modalRow, data);
  $('modalDlNote').textContent = `On air: ${data.label}`;
}

function wireModalExtras() {
  const row = $('lrRow');
  row.querySelectorAll('button[data-lr]').forEach(b => {
    b.onclick = async () => {
      const pid = modalPid, r = modalRow;
      $('modalDlNote').textContent = 'Loading L/R split\u2026';
      const data = await buildLRCompareData(pid, r, b.dataset.lr).catch(() => null);
      if (modalPid !== pid) return;
      if (!data) { $('modalDlNote').textContent = 'No lefty/righty split available for this player.'; return; }
      pushCustomGraphic(data, wantsPitching(r) && !wantsBatting(r) ? 'pit' : 'bat');
    };
  });

  $('rankFind').onclick = async () => {
    const pid = modalPid, r = modalRow;
    const box = $('rankRow');
    box.hidden = false;
    box.innerHTML = '<span class="modal-empty">Checking leaderboards\u2026</span>';
    const isPit = wantsPitching(r) && !wantsBatting(r);
    const hits = await findNotableRankings(pid, isPit).catch(() => []);
    if (modalPid !== pid) return;
    if (!hits.length) { box.innerHTML = '<span class="modal-empty">Not top 10 in any tracked category.</span>'; return; }
    box.innerHTML = '';
    hits.forEach(h => {
      const b = el('button', 'tf-pill', `${ordinal(h.rank)} ${h.scope} ${h.label}`);
      b.type = 'button';
      b.onclick = () => pushCustomGraphic(buildRankGraphicData(h), isPit ? 'pit' : 'bat');
      box.appendChild(b);
    });
  };

  // team tenure loads in the background; the row simply stays empty if there's only one club
  (async () => {
    const pid = modalPid, r = modalRow;
    const group = wantsPitching(r) && !wantsBatting(r) ? 'pitching' : 'hitting';
    const teams = await fetchTeamTenure(pid, group).catch(() => []);
    if (modalPid !== pid || teams.length < 2) return;
    const box = $('teamRow');
    box.innerHTML = '<label>Team tenure</label>';
    teams.forEach(t => {
      const b = el('button', 'tf-pill', nickOf(t.name));
      b.type = 'button';
      b.onclick = () => {
        const label = `CAREER WITH ${nickOf(t.name).toUpperCase()}`;
        const st = t.stat;
        const data = group === 'pitching'
          ? { label, splitLabel: label, cells: [['IP', st.inningsPitched], ['ERA', st.era], ['WHIP', st.whip],
              ['K', st.strikeOuts], ['BB', st.baseOnBalls], ['W-L', `${st.wins}-${st.losses}`]] }
          : { label, splitLabel: label, hitLine: `${st.hits}-for-${st.atBats}`, cells: [
              ['AVG', st.avg], ['OBP', st.obp], ['SLG', st.slg], ['OPS', st.ops],
              ['HR', st.homeRuns], ['RBI', st.rbi]] };
        pushCustomGraphic(data, group === 'pitching' ? 'pit' : 'bat');
      };
      box.appendChild(b);
    });
  })();

  // opponent search reuses the already-loaded league-wide player index, so it's instant and
  // needs no extra API calls just to offer suggestions
  let mDeb = null;
  $('matchupSearch').value = '';
  $('matchupResults').innerHTML = '';
  $('matchupSearch').oninput = () => {
    clearTimeout(mDeb);
    const q = $('matchupSearch').value.trim().toLowerCase();
    mDeb = setTimeout(() => {
      const box = $('matchupResults');
      if (q.length < 3) { box.innerHTML = ''; return; }
      const hits = allPlayers.filter(p => p.name.toLowerCase().includes(q) && String(p.id) !== String(modalPid)).slice(0, 6);
      box.innerHTML = '';
      if (!hits.length) { box.innerHTML = '<span class="modal-empty">No match.</span>'; return; }
      hits.forEach(op => {
        const b = el('button', 'tf-pill', `${op.name} (${op.pos})`);
        b.type = 'button';
        b.onclick = async () => {
          const pid = modalPid, r = modalRow;
          $('modalDlNote').textContent = 'Loading matchup\u2026';
          const data = await buildMatchupData(pid, r, op.id, op.name).catch(() => null);
          if (modalPid !== pid) return;
          if (!data) { $('modalDlNote').textContent = `No career matchup data vs. ${op.name}.`; return; }
          pushCustomGraphic(data, wantsPitching(r) && !wantsBatting(r) ? 'pit' : 'bat');
        };
        box.appendChild(b);
      });
    }, 150);
  };
}

function closeModal() { $('modalBackdrop').hidden = true; }

// =====================================================================================
// Broadcast graphic: a lower-third PNG, drawn on canvas so it needs no external assets
// =====================================================================================

// Same stat lineup as the other lower-third tools: rate line first, then K%/BB%, then the
// counting stats worth showing. splitLabel drives the gold line above the cells; label is kept
// for the on-air chip text on the control panel.
function battingGraphicData(st, label, tf) {
  if (!st) return null;
  // vs a specific handedness the sample is small enough that HR/RBI are worth showing even at
  // zero; otherwise only surface counting stats that actually happened.
  const extra = isSplitTf(tf)
    ? [['HR', +st.homeRuns || 0], ['RBI', +st.rbi || 0]]
    : [['HR', st.homeRuns], ['RBI', st.rbi]].filter(([, v]) => +v > 0);
  const cells = [['AVG', st.avg], ['OBP', st.obp], ['SLG', st.slg], ['OPS', st.ops],
    ['K%', kPct(st.strikeOuts, st.plateAppearances)], ['BB%', bbPct(st.baseOnBalls, st.plateAppearances)],
    ...extra];
  return { label, splitLabel: label, hitLine: `${st.hits}-for-${st.atBats}`, cells };
}
function pitchingGraphicData(st, label) {
  if (!st) return null;
  return { label, splitLabel: label, cells: [
    ['IP', st.inningsPitched], ['ERA', st.era], ['WHIP', st.whip], ['W-L', `${st.wins}-${st.losses}`],
    ['K%', kPct(st.strikeOuts, st.battersFaced)], ['BB%', bbPct(st.baseOnBalls, st.battersFaced)] ] };
}
// vs-L/R pitching splits have no ERA/W-L/saves (not a real concept for that split), so swap in
// what the API actually gives us: IP/WHIP/K%/BB% plus the opposing batting line (BAA/HR)
function pitchingSplitGraphicData(st, label) {
  if (!st) return null;
  return { label, splitLabel: label, hitLine: `${st.hits}-for-${st.atBats} allowed`, cells: [
    ['IP', st.inningsPitched], ['WHIP', st.whip], ['BAA', st.avg],
    ['K%', kPct(st.strikeOuts, st.battersFaced)], ['BB%', bbPct(st.baseOnBalls, st.battersFaced)],
    ['HR', +st.homeRuns || 0] ] };
}

// Real Wake N Jake logo lives at ./wnj-logo.png, next to this file (drop it in the same
// GitHub repo / folder). Falls back to a gold text mark if that file isn't there yet.
const WNJ_LOGO_URL = './wnj-logo.png';
let wnjLogoImgPromise = null;

async function drawBrandLockup(ctx, W, H) {
  const dockH = 56, bottomY = H - 14, rightMargin = 18;
  wnjLogoImgPromise = wnjLogoImgPromise || loadSafeImage(WNJ_LOGO_URL);
  const wnj = await wnjLogoImgPromise;
  if (!wnj) {
    ctx.textAlign = 'right'; ctx.fillStyle = '#F7C600'; ctx.font = '800 15px "Sofia Sans Extra Condensed"';
    ctx.fillText('WAKE N JAKE', W - rightMargin, bottomY);
    return;
  }
  const h = dockH, w = wnj.width * (h / wnj.height);
  ctx.drawImage(wnj, W - rightMargin - w, bottomY - h, w, h);
}

// Rounded-rect path helper for the gold-bordered broadcast panel
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function loadSafeImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const t = document.createElement('canvas'); t.width = t.height = 2;
        t.getContext('2d').drawImage(img, 0, 0, 2, 2);
        t.toDataURL();
        resolve(img);
      } catch { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function renderLowerThird(data, row, pid) {
  await Promise.all([
    document.fonts.load('64px Anton'),
    document.fonts.load('700 18px "Sofia Sans Extra Condensed"'),
    document.fonts.load('800 40px "Sofia Sans Extra Condensed"'),
  ]);
  const img = await loadSafeImage(headshotURL(pid));

  const CW = 1920, CH = 1080, W = 1920, H = 200, BOTTOM_MARGIN = 60;
  const canvas = document.createElement('canvas'); canvas.width = CW; canvas.height = CH;
  const ctx = canvas.getContext('2d');
  ctx.translate(0, CH - H - BOTTOM_MARGIN);

  const bw = 6, radius = 18;
  roundRectPath(ctx, bw / 2, bw / 2, W - bw, H - bw, radius);
  ctx.fillStyle = '#17AE6C'; ctx.fill();
  ctx.lineWidth = bw; ctx.strokeStyle = '#F7C600'; ctx.stroke();

  const cx = 112, cy = H / 2, r = 75;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.closePath();
  if (img) {
    ctx.save(); ctx.clip();
    const size = r * 2, scale = Math.max(size / img.width, size / img.height);
    const iw = img.width * scale, ih = img.height * scale;
    ctx.drawImage(img, cx - iw / 2, cy - ih / 2, iw, ih);
    ctx.restore();
  } else {
    ctx.fillStyle = '#1A1A1A'; ctx.fill();
    ctx.fillStyle = '#F7C600'; ctx.font = '700 16px "Sofia Sans Extra Condensed"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('NO PHOTO', cx, cy);
  }
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.lineWidth = 5; ctx.strokeStyle = '#F7C600'; ctx.stroke();

  const nx = 226;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#F7C600'; ctx.font = '62px Anton';
  ctx.fillText(row.name.toUpperCase(), nx, 124);
  ctx.fillStyle = '#F5F5F0'; ctx.font = '700 20px "Sofia Sans Extra Condensed"';
  ctx.fillText([row.pos, row.team].filter(Boolean).join('  ·  ').toUpperCase(), nx, 156);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  const divX = 800;
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(divX, 34); ctx.lineTo(divX, H - 34); ctx.stroke();

  // reserve room on the right for the logo dock so the last stat never sits under it
  const LOGO_RESERVE = 110, MIN_GAP = 26;
  const startX = divX + 30, avail = W - LOGO_RESERVE - startX;
  ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;

  // single-stat sentence: same layout the live bar uses, so the PNG matches what's on air
  if (data.sentenceMode) {
    const [[words, value]] = data.cells;
    let size = 76;
    const widthAt = px => {
      ctx.font = `800 ${px}px "Sofia Sans Extra Condensed"`;
      return ctx.measureText(value).width + px * 0.22 + ctx.measureText(words).width;
    };
    while (size > 28 && widthAt(size) > avail) size -= 4;
    ctx.font = `800 ${size}px "Sofia Sans Extra Condensed"`;
    const vW = ctx.measureText(value).width, gap = size * 0.22, wW = ctx.measureText(words).width;
    let x = startX + (avail - (vW + gap + wW)) / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#F7C600'; ctx.fillText(value, x, H / 2 + 26);
    ctx.fillStyle = '#F5F5F0'; ctx.fillText(words, x + vW + gap, H / 2 + 26);
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    await drawBrandLockup(ctx, W, H);
    return { canvas, hadPhoto: !!img };
  }

  // split name (gold, e.g. "LAST 30 DAYS") and the hits-for-AB count (white, e.g. "12-FOR-72")
  // sit side by side above the stat cells — either can be absent and the other still centers alone
  if (data.splitLabel || data.hitLine) {
    ctx.font = '700 22px "Sofia Sans Extra Condensed"';
    const parts = [];
    if (data.splitLabel) parts.push({ text: data.splitLabel.toUpperCase(), color: '#F7C600' });
    if (data.hitLine) parts.push({ text: data.hitLine.toUpperCase(), color: '#F5F5F0' });
    const sep = '   \u00b7   ';
    const widths = parts.map(pp => ctx.measureText(pp.text).width);
    const sepW = ctx.measureText(sep).width;
    let x = startX + avail / 2 - (widths.reduce((a, b) => a + b, 0) + sepW * (parts.length - 1)) / 2;
    ctx.textAlign = 'left';
    parts.forEach((pp, i) => {
      ctx.fillStyle = pp.color; ctx.fillText(pp.text, x, 44); x += widths[i];
      if (i < parts.length - 1) { ctx.fillStyle = '#F5F5F0'; ctx.fillText(sep, x, 44); x += sepW; }
    });
  }

  // Size the whole row together so every stat stays the same scale, shrinking only as far as
  // needed to stay on one line — then space cells edge to edge like flex space-between. Each
  // cell's footprint is the wider of its value or its label.
  const cellWidths = size => {
    const ls = Math.round(size * 0.32);
    return data.cells.map(([label, value]) => {
      ctx.font = `800 ${size}px "Sofia Sans Extra Condensed"`;
      const vw = ctx.measureText(String(value)).width;
      ctx.font = `700 ${ls}px "Sofia Sans Extra Condensed"`;
      const lw = ctx.measureText(label).width;
      return Math.max(vw, lw);
    });
  };
  let valueSize = 85, widths = cellWidths(valueSize);
  const gapNeeded = MIN_GAP * Math.max(0, data.cells.length - 1);
  while (valueSize > 34 && widths.reduce((a, b) => a + b, 0) + gapNeeded > avail) {
    widths = cellWidths(valueSize -= 4);
  }
  const labelSize = Math.max(16, Math.round(valueSize * 0.32));
  const n = data.cells.length, totalContent = widths.reduce((a, b) => a + b, 0);
  const MAX_GAP = 100;
  let gapEach = n > 1 ? (avail - totalContent) / (n - 1) : 0;
  let cellX = startX;
  if (gapEach > MAX_GAP) {
    gapEach = MAX_GAP;
    const groupW = totalContent + gapEach * (n - 1);
    cellX = startX + (avail - groupW) / 2;
  }
  data.cells.forEach(([label, value], i) => {
    const x = cellX + widths[i] / 2;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#F5F5F0'; ctx.font = `800 ${valueSize}px "Sofia Sans Extra Condensed"`;
    ctx.fillText(String(value), x, H / 2 + 22);
    ctx.fillStyle = '#F7C600'; ctx.font = `700 ${labelSize}px "Sofia Sans Extra Condensed"`;
    ctx.fillText(label, x, H / 2 + 52);
    cellX += widths[i] + gapEach;
  });
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  await drawBrandLockup(ctx, W, H);

  return { canvas, hadPhoto: !!img };
}

// ---- on-air: push a player's stat line to the OBS display view (control side) ----

let onAirPid = null, onAirKind = null;

function pushOnAir(pid, kind, row, data) {
  if (!row || !data) return;
  onAirPid = pid; onAirKind = kind;
  const payload = { pid, kind, name: row.name, pos: row.pos, team: row.team, data, ts: Date.now() };
  try { localStorage.setItem(LT_KEY, JSON.stringify(payload)); } catch {}
  if (ltChannel) ltChannel.postMessage(payload);
  if (ltRef) ltRef.set(payload).catch(e => console.error('Firebase push failed:', e));
  updateOnAirUI(payload);
  renderAllTargets(payload);   // keeps the in-modal preview in step with what just went on air
}

function clearOnAir() {
  onAirPid = onAirKind = null;
  try { localStorage.removeItem(LT_KEY); } catch {}
  if (ltChannel) ltChannel.postMessage({ clear: true });
  if (ltRef) ltRef.set(null).catch(e => console.error('Firebase clear failed:', e));
  updateOnAirUI(null);
  renderAllTargets(null);
}

function updateOnAirUI(payload) {
  const box = $('onair'); if (!box) return;
  box.hidden = !payload;
  if (payload) $('onairText').innerHTML = `On air: <b>${payload.name}</b> · ${payload.data.label}`;
}

// Whenever the modal opens or the timeframe changes, auto-push whichever line is primary
// (hitting for position players, pitching for pitchers) so the OBS bar always tracks what's on screen.
function autoPushOnAir() {
  if (!modalPid || !modalRow) return;
  const pitFn = isSplitTf(modalTf) ? pitchingSplitGraphicData : pitchingGraphicData;
  if (wantsPitching(modalRow) && !wantsBatting(modalRow)) {
    const data = pitFn(modalPit, scopedSplitLabel(modalTf, 'pitching'));
    if (data) pushOnAir(modalPid, 'pit', modalRow, data);
  } else {
    const batData = battingGraphicData(modalBat, scopedSplitLabel(modalTf, 'hitting'), modalTf);
    const data = batData || pitFn(modalPit, scopedSplitLabel(modalTf, 'pitching'));
    if (data) pushOnAir(modalPid, data === batData ? 'bat' : 'pit', modalRow, data);
  }
}

// matches the CSS transition duration on .lt-bar, so a player-to-player swap fades the old one
// fully out before the new content is painted and faded back in — never an instant content pop
const LT_FADE_MS = 350;
// Per-target state: the OBS display and the modal preview render the same payload independently,
// so they must not share a visibility flag or fade timer or they'd interfere with each other.
const ltState = new WeakMap();
const stateFor = root => {
  if (!ltState.has(root)) ltState.set(root, { visible: false, timer: null });
  return ltState.get(root);
};

// The preview stage is a real 1920px-wide slice of the broadcast frame; scaling it to the modal's
// width is what makes it a true preview rather than a lookalike built at a different size.
function fitPreviewStage(root) {
  const wrap = root.classList && root.classList.contains('modal-preview-wrap') ? root
             : root.querySelector('.modal-preview-wrap');
  if (!wrap) return;
  const stage = wrap.querySelector('.modal-preview-stage');
  if (!stage) return;
  const scale = wrap.clientWidth / 1920;
  stage.style.transform = `scale(${scale})`;
  wrap.style.height = Math.round(280 * scale) + 'px';
}

function paintOnAirBar(root, payload) {
  const { name, pos, team, data } = payload;
  const q = sel => root.querySelector(sel);
  const bar = q('.lt-bar');
  q('.lt-headshot').src = headshotURL(payload.pid);
  q('.lt-name').textContent = name.toUpperCase();
  q('.lt-sub').textContent = [pos, team].filter(Boolean).join('  \u00b7  ').toUpperCase();
  const hitEl = q('.lt-hitline');
  const bits = [
    data.splitLabel ? `<span class="lt-splitlabel">${data.splitLabel.toUpperCase()}</span>` : '',
    data.hitLine ? `<span class="lt-hitcount">${data.hitLine.toUpperCase()}</span>` : '',
  ].filter(Boolean);
  hitEl.innerHTML = bits.join('  \u00b7  ');
  hitEl.style.display = bits.length ? '' : 'none';

  const cellsEl = q('.lt-cells');
  const LOGO_RESERVE = 90, MIN_GAP = 26;
  const availW = Math.max(200, (cellsEl.parentElement.clientWidth || 1300) - LOGO_RESERVE);

  // Two situational splits side by side, each its own mini stat block.
  if (data.splitCompare) {
    cellsEl.className = 'lt-cells';
    cellsEl.style.justifyContent = 'center';
    cellsEl.style.gap = '0px';
    cellsEl.style.paddingRight = LOGO_RESERVE + 'px';
    const secondKey = data.isPitcher ? 'WHIP' : 'OPS';
    const col = side => `<div class="lt-splitcol">
        <div class="lt-splitcol-label">${side.label.toUpperCase()} (${side.pa} ${data.isPitcher ? 'BF' : 'PA'})</div>
        <div class="lt-splitcol-stats">
          <div class="lt-cell"><div class="v" style="font-size:52px">${side.avg}</div><div class="k" style="font-size:18px">AVG</div></div>
          <div class="lt-cell"><div class="v" style="font-size:52px">${side.ops}</div><div class="k" style="font-size:18px">${secondKey}</div></div>
          <div class="lt-cell"><div class="v" style="font-size:52px">${side.hr}</div><div class="k" style="font-size:18px">HR</div></div>
        </div>
      </div>`;
    cellsEl.innerHTML = `<div class="lt-splitcompare">${col(data.left)}<div class="lt-splitcompare-divider"></div>${col(data.right)}</div>`;
    const cmp = cellsEl.querySelector('.lt-splitcompare');
    let sz = 52;
    while (sz > 24 && cmp.scrollWidth > availW) {
      sz -= 3;
      cmp.querySelectorAll('.v').forEach(v => v.style.fontSize = sz + 'px');
    }
    bar.classList.add('lt-visible');
    stateFor(root).visible = true;
    return;
  }

  // One stat, stated as a sentence — a single unit that shrinks as a whole and centres, rather
  // than a row of cells to space out.
  if (data.sentenceMode) {
    const [[words, value]] = data.cells;
    cellsEl.className = 'lt-cells lt-cells-sentence';
    cellsEl.style.gap = '0px';
    cellsEl.style.paddingRight = LOGO_RESERVE + 'px';
    cellsEl.innerHTML = `<div class="lt-sentence-wrap"><div class="lt-sentence-line">` +
      `<span class="v">${value}</span><span class="w">${words}</span></div>` +
      `${data.rankNote ? `<div class="lt-ranknote">${data.rankNote.toUpperCase()}</div>` : ''}</div>`;
    const line = cellsEl.querySelector('.lt-sentence-line');
    const vEl = line.querySelector('.v'), wEl = line.querySelector('.w');
    let size = 76;
    const apply = px => { vEl.style.fontSize = px + 'px'; wEl.style.fontSize = px + 'px'; };
    apply(size);
    while (size > 28 && line.scrollWidth > availW) apply(size -= 4);
    bar.classList.add('lt-visible');
    stateFor(root).visible = true;
    return;
  }
  cellsEl.className = 'lt-cells';

  let valueSize = 85;
  const paint = () => {
    cellsEl.innerHTML = data.cells.map(([label, value]) =>
      `<div class="lt-cell">
         <div class="v" style="font-size:${valueSize}px">${value}</div>
         <div class="k" style="font-size:${Math.round(valueSize * 0.32)}px">${label}</div>
       </div>`).join('');
  };
  paint();
  const contentW = () => [...cellsEl.querySelectorAll('.lt-cell')].reduce((a, c) => a + c.offsetWidth, 0);
  const gapNeeded = () => MIN_GAP * Math.max(0, data.cells.length - 1);
  while (valueSize > 34 && contentW() + gapNeeded() > availW) {
    valueSize -= 4;
    cellsEl.querySelectorAll('.v').forEach(v => v.style.fontSize = valueSize + 'px');
    cellsEl.querySelectorAll('.k').forEach(k => k.style.fontSize = Math.round(valueSize * 0.32) + 'px');
  }
  cellsEl.style.paddingRight = LOGO_RESERVE + 'px';

  const cells = [...cellsEl.querySelectorAll('.lt-cell')];
  const totalContent = cells.reduce((a, c) => a + c.offsetWidth, 0);
  const n = cells.length, MAX_GAP = 100;
  const idealGap = n > 1 ? (availW - totalContent) / (n - 1) : 0;
  if (idealGap > MAX_GAP) { cellsEl.style.justifyContent = 'center'; cellsEl.style.gap = MAX_GAP + 'px'; }
  else { cellsEl.style.justifyContent = 'space-between'; cellsEl.style.gap = '0px'; }

  bar.classList.add('lt-visible');
  stateFor(root).visible = true;
}

function renderOnAirBar(root, payload) {
  if (!root) return;
  const bar = root.querySelector('.lt-bar');
  if (!bar) return;
  const st = stateFor(root);
  clearTimeout(st.timer);

  const emptyEl = root.querySelector('.modal-preview-empty');
  if (emptyEl) emptyEl.style.display = payload ? 'none' : 'flex';

  if (!payload) {
    bar.classList.remove('lt-visible');
    st.visible = false;
    return;
  }
  fitPreviewStage(root);
  if (st.visible) {
    // already showing someone else — fade out first so the swap never jump-cuts mid-stat
    bar.classList.remove('lt-visible');
    st.timer = setTimeout(() => paintOnAirBar(root, payload), LT_FADE_MS);
  } else {
    paintOnAirBar(root, payload);
  }
}

// The two render targets: the OBS display page, and the live preview inside the player modal.
const displayRoot = () => document.getElementById('lowerThirdDisplay');
const previewRoot = () => document.getElementById('modalPreviewFrame');

function renderAllTargets(payload) {
  renderOnAirBar(displayRoot(), payload);
  const pv = previewRoot();
  if (pv) renderOnAirBar(pv, payload);
}

function initDisplay() {
  // Firebase realtime is the primary transport: .on('value') fires immediately with whatever is
  // currently on air (so a mid-show restart repaints correctly) and again on every change.
  if (ltRef) {
    ltRef.on('value', snap => applyOnAir(snap.val(), 'realtime'),
      err => console.error('Firebase subscribe failed:', err));
  }
  // Always run the REST poll too — it costs one tiny request every few seconds and is what keeps
  // the graphic correct in OBS if the socket path ever fails silently.
  startOnAirPolling(4000);
  if (!ltRef) {
    // no Firebase (offline / SDK blocked) — fall back to same-browser state
    try {
      const cached = JSON.parse(localStorage.getItem(LT_KEY) || 'null');
      if (cached) renderAllTargets(cached);
    } catch {}
  }
  // same-browser fast paths, harmless alongside Firebase
  if (ltChannel) ltChannel.onmessage = e => applyOnAir(e.data, 'channel');
  window.addEventListener('storage', e => {
    if (e.key !== LT_KEY) return;
    try { applyOnAir(e.newValue ? JSON.parse(e.newValue) : null, 'storage'); } catch {}
  });
}

async function downloadGraphic(kind) {  // kind: 'bat' | 'pit'
  const pid = modalPid, row = modalRow;
  const btn = $(kind === 'bat' ? 'modalDownloadBat' : 'modalDownloadPit'), note = $('modalDlNote');
  if (!row) return;
  const pitFn = isSplitTf(modalTf) ? pitchingSplitGraphicData : pitchingGraphicData;
  const data = kind === 'bat' ? battingGraphicData(modalBat, scopedSplitLabel(modalTf, 'hitting'), modalTf)
                               : pitFn(modalPit, scopedSplitLabel(modalTf, 'pitching'));
  if (!data) { note.textContent = `No ${kind === 'bat' ? 'hitting' : 'pitching'} stats available to build a graphic yet.`; return; }

  btn.disabled = true; note.textContent = `Building graphic…`;
  try {
    pushOnAir(pid, kind, row, data);
    const { canvas, hadPhoto } = await renderLowerThird(data, row, pid);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (!blob) throw new Error('Canvas export failed');
    const a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${row.name.replace(/[^\w\d]+/g, '-')}-${kind}-${modalTf}-lower-third.png`;
    a.click(); URL.revokeObjectURL(a.href);
    note.textContent = hadPhoto ? 'Pushed to OBS + downloaded ✓' : 'Pushed to OBS + downloaded ✓ (headshot host blocked embedding — graphic saved without it)';
  } catch (e) {
    note.textContent = 'Could not build the graphic: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

// =====================================================================================
// Wiring
// =====================================================================================

const guard = fn => (...a) => Promise.resolve(fn(...a)).catch(e => say(e.message, true));

let searchDebounce = null;
$('find').oninput = () => {
  clearTimeout(searchDebounce);
  const q = $('find').value;
  searchDebounce = setTimeout(() => guard(async () => renderSearchResults(q))(), 150);
};

$('division').onchange = () => {
  const dv = $('division').value;
  populateTeamSelect(dv);
  $('team').value = '';
  $('find').value = '';
  currentTeamId = null;
  renderLanding();
};

// Browse-by mode: teams grid, position grid, or one flat list of everyone.
$('browseSeg').onclick = e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  browseMode = btn.dataset.mode;
  [...$('browseSeg').querySelectorAll('button')].forEach(b => b.classList.toggle('on', b === btn));
  $('team').value = '';
  $('find').value = '';
  currentTeamId = null;
  renderLanding();
};

// Position acts as a filter everywhere: on a team roster it narrows that roster in place;
// otherwise it lists everyone at that position across the current division scope.
$('position').onchange = () => {
  posFilter = $('position').value;
  $('find').value = '';
  if (currentView === 'roster' && currentTeamId) paintRoster();
  else renderLanding();
};
$('goHome').onclick = () => {
  $('division').value = '';
  populateTeamSelect('');
  $('team').value = '';
  $('find').value = '';
  $('position').value = '';
  posFilter = '';
  currentTeamId = null;
  renderLanding();
};
$('team').onchange = () => {
  const id = $('team').value;
  $('find').value = '';
  if (id) guard(loadRoster)(+id);
  else { currentTeamId = null; renderLanding(); }
};
$('season').onchange = guard(async () => {
  await Promise.all([loadTeams($('season').value), loadPlayerIndex($('season').value)]);
  if (currentView === 'roster' && currentTeamId) guard(loadRoster)(currentTeamId);
  else renderLanding();
});

$('out').onclick = e => {
  const th = e.target.closest('thead th[data-key]');
  if (th) {
    const { key, tbl } = th.dataset;
    const same = sortState.table === tbl && sortState.key === key;
    sortState = { table: tbl, key, dir: same ? -sortState.dir : 1 };
    if (tbl === 'roster') paintRoster(); else paintSearch();
    return;
  }
  const tr = e.target.closest('tbody tr');
  if (!tr || tr.classList.contains('group') || !tr.dataset.pid) return;
  openPlayerModal(tr.dataset.pid);
};
$('modalClose').onclick = closeModal;
$('modalDownloadBat').onclick = () => downloadGraphic('bat');
$('modalDownloadPit').onclick = () => downloadGraphic('pit');
$('modalBackdrop').onclick = e => { if (e.target.id === 'modalBackdrop') closeModal(); };
document.onkeydown = e => { if (e.key === 'Escape' && !$('modalBackdrop').hidden) closeModal(); };
$('openDisplay').onclick = () => {
  const url = new URL(location.href); url.searchParams.set('display', '1');
  window.open(url.href, '_blank');
};
$('onairClear').onclick = clearOnAir;
$('modalExitOnAir').onclick = () => {
  clearOnAir();
  $('modalDlNote').textContent = 'Removed from OBS ✓';
};

window.addEventListener('resize', () => { const pv = previewRoot(); if (pv) fitPreviewStage(pv); });

const yr = new Date().getFullYear();
if (isDisplayMode) {
  initDisplay();
} else {
  $('season').innerHTML = Array.from({length: yr - 2013}, (_, i) => yr - i).map(y => `<option>${y}</option>`).join('');
  guard(async () => {
    say('Loading teams…');
    await Promise.all([loadTeams($('season').value), loadPlayerIndex($('season').value)]);
    say('');
    renderLanding();
  })();
}
</script>
