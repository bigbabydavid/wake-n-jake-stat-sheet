<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stat Sheet — Wake N Jake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sofia+Sans+Extra+Condensed:wght@700;800&family=Sofia+Sans+Semi+Condensed:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fff; --chrome:#F7F7F7; --ink:#1F1F1F; --dim:#6B6B6B;
    --grid:#B7B7B7; --hard:#7F7F7F;
    --red:#B3261E; --blue:#1F4E79; --green:#217346;
    --team:#D9D9D9; --sum:#E6E6E6; --sub:#EFEFEF;
    /* Wake N Jake brand — colors sampled directly from show graphics.
       Admin UI uses a darkened, accessible shade of the brand green (the true brand
       green/gold only read correctly against dark backgrounds, per the reference art,
       so the broadcast graphic below uses the real values on black; this darker --accent
       is a same-family shade for links/buttons/labels on the white control panel). */
    --accent:#0E6E44; --accent-hover:#0A5535;
    --wnj-green:#17AE6C; --wnj-gold:#F7C600; --wnj-black:#0A0A0A; --white-accent:#F5F5F0;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--paper);
    font-family:"Sofia Sans Semi Condensed",Roboto,system-ui,sans-serif}
  header{padding:14px 20px 12px;border-bottom:2px solid var(--hard);background:var(--chrome);
    position:sticky;top:0;z-index:40}
  .eyebrow{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;text-transform:uppercase;
    font-size:12px;letter-spacing:2px;color:var(--dim);margin:0 0 4px}
  .eyebrow::before{content:"— ";color:var(--accent)}
  .titlerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-family:"Anton",sans-serif;font-style:normal;font-size:34px;margin:0;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .home-btn{background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:999px;
    padding:6px 14px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.6px;font-size:12.5px;cursor:pointer;flex:none}
  .home-btn:hover{background:var(--accent);color:#fff}
  .teambadge{display:flex;align-items:center;gap:8px}
  .teambadge img{width:30px;height:30px;border-radius:50%;background:#fff;padding:3px;
    box-shadow:0 0 0 1px var(--grid);object-fit:contain}
  .teambadge .tn{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.4px;color:var(--dim);font-size:13px}
  .datanote{position:absolute;top:14px;right:20px;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-size:11px;letter-spacing:.4px;color:var(--dim);background:#fff;border:1px solid var(--grid);
    border-radius:4px;padding:5px 9px;text-transform:uppercase}
  .datanote b{color:var(--ink);font-weight:800}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}
  label{display:block;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;font-size:12px;letter-spacing:1px;color:var(--accent);margin-bottom:3px}
  select,input{background:#fff;color:var(--ink);border:1px solid var(--grid);border-radius:4px;
    padding:7px 9px;font-family:inherit;font-size:15px;max-width:min(60vw,520px)}
  select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
  input::placeholder{color:#a8a8a8}
  #status{padding:14px 20px;color:var(--dim)}
  #status.err{color:var(--red)}
  #status:empty{display:none}
  main{padding:0 20px 60px}
  h2{font-family:"Anton",sans-serif;font-style:normal;font-size:21px;margin:24px 0 7px;letter-spacing:.5px;
    text-transform:uppercase;color:var(--accent)}
  .wrap{overflow-x:auto;border:1px solid var(--hard);background:#fff}

  table{border-collapse:separate;border-spacing:0;font-size:14px;width:100%}
  th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid)}
  thead th{position:sticky;top:0;background:#fff;z-index:10;
    font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.6px;font-size:12px;color:var(--accent)}
  thead th[data-key]{cursor:pointer;user-select:none}
  thead th[data-key]:hover{background:#EAF3EC}
  thead th[data-key].sort-asc,thead th[data-key].sort-desc{background:#EAF3EC;color:var(--blue)}
  thead th[data-key].sort-asc::after{content:" ▲";font-size:9px}
  thead th[data-key].sort-desc::after{content:" ▼";font-size:9px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  tr.group td{background:var(--team);font-family:"Anton",sans-serif;font-style:normal;
    font-size:15px;color:var(--blue);letter-spacing:.5px;padding:6px 10px;
    text-transform:uppercase;border-bottom:1px solid var(--hard)}
  table.players tbody tr:not(.group){cursor:pointer}
  table.players tbody tr:not(.group):hover td{background:#E4E4E4}
  table.players td.name{font-weight:700}
  table.players td.name:hover{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-weight:800;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
  .badge.active{background:#E3F2E3;color:var(--green)}
  .badge.il{background:#FBE1E1;color:var(--red)}
  .badge.res{background:#EFEFEF;color:var(--dim)}
  .metanote{color:var(--dim);font-size:13px;margin:0 0 10px}

  /* ---- team directory (default browse view) ---- */
  .leaguehead{font-family:"Anton",sans-serif;font-size:18px;letter-spacing:.5px;color:var(--blue);
    text-transform:uppercase;margin:22px 0 4px}
  .divhead{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;text-transform:uppercase;
    font-size:12px;letter-spacing:1.4px;color:var(--accent);margin:14px 0 6px}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:6px}
  .team-card{display:flex;align-items:center;gap:9px;border:1px solid var(--grid);border-radius:6px;
    padding:8px 10px;background:#fff;cursor:pointer;text-align:left}
  .team-card:hover{border-color:var(--accent);background:#EFF7F1}
  .team-card img{width:28px;height:28px;object-fit:contain;flex:none}
  .team-card .tname{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;font-size:13px;
    text-transform:uppercase;letter-spacing:.3px;line-height:1.2}

  button{background:#fff;color:var(--ink);border:1px solid var(--grid);border-radius:4px;
    padding:7px 11px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.8px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.4;cursor:default;border-color:var(--grid);color:var(--ink)}
  @media (max-width:640px){
    .datanote{position:static;display:inline-block;margin:0 0 8px}
    h1{font-size:28px}
  }

  /* ---- player modal ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(40,40,40,.5);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-backdrop[hidden]{display:none}
  .modal{background:#fff;border:1px solid var(--hard);border-radius:6px;max-width:440px;
    width:100%;max-height:88vh;overflow:auto;padding:20px;position:relative;
    box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal-close{position:absolute;top:10px;right:10px;background:#fff;border:1px solid var(--grid);
    color:var(--dim);width:28px;height:28px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .modal-close:hover{color:var(--accent);border-color:var(--accent)}
  .modal-head{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-right:38px}
  .modal-headshot{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--chrome);
    border:2px solid var(--grid);flex:none}
  .modal-name{font-family:"Anton",sans-serif;font-size:21px;letter-spacing:.3px;line-height:1.1}
  .modal-sub{color:var(--dim);font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;font-size:12px;letter-spacing:1px;margin-top:4px}

  .tf-pills{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px}
  .tf-pill{background:var(--chrome);color:var(--ink);border:1px solid var(--grid);border-radius:999px;
    padding:6px 12px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.5px;font-size:11.5px;cursor:pointer}
  .tf-pill:hover{border-color:var(--accent)}
  .tf-pill.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .modal-export-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
  .modal-export-btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:4px;
    padding:10px 16px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.6px;font-size:13px;cursor:pointer}
  .modal-export-btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .modal-export-btn:disabled{opacity:.35;cursor:default;background:var(--chrome);color:var(--dim);border-color:var(--grid)}
  .modal-section{margin-bottom:16px}
  .modal-section h3{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;font-size:12px;letter-spacing:1.5px;color:var(--accent);margin:0 0 8px}
  .modal-section h3::before{content:"— "}
  .modal-line{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;
    color:var(--ink);margin-bottom:10px;font-weight:800}
  .modal-hitline{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;font-size:12px;color:var(--dim);margin-bottom:4px}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat-grid .cell{background:var(--chrome);border:1px solid var(--grid);border-radius:4px;
    padding:7px 4px;text-align:center}
  .stat-grid .cell .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;
    font-weight:800;color:var(--ink)}
  .stat-grid .cell .k{font-size:10px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.5px;margin-top:3px}
  .modal-empty{color:var(--dim);font-size:13px}
  .modal-dlnote{color:var(--dim);font-size:10px;text-align:right;margin-top:8px;min-height:12px}

  /* ---- control page: on-air status chip ---- */
  .onair{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-size:12px;letter-spacing:.4px;color:var(--dim)}
  .onair-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;
    box-shadow:0 0 0 3px rgba(192,0,0,.18);animation:onair-pulse 1.6s ease-in-out infinite}
  @keyframes onair-pulse{50%{opacity:.35}}
  #onairText b{color:var(--ink);font-weight:800}
  .exit-btn{background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:4px;
    padding:5px 12px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.6px;font-size:11.5px;cursor:pointer}
  .exit-btn:hover{background:var(--accent);color:#fff}

  /* ---- OBS display view (?display=1) ---- */
  #lowerThirdDisplay{display:none}
  body.display-mode #lowerThirdDisplay{display:block;position:relative;width:1920px;height:1080px}
  /* always present in the DOM (it's position:absolute, so it never affects layout) — shown/hidden and
     swapped between players purely via opacity, so bringing it on, taking it off, or switching to a
     new player all get a smooth fade instead of an instant pop */
  .lt-bar{display:flex;align-items:center;gap:22px;position:absolute;left:0;right:0;bottom:60px;height:200px;
    padding:0 40px;background-color:#17AE6C;border:6px solid #F7C600;border-radius:18px;
    box-sizing:border-box; opacity:0; pointer-events:none; transition:opacity .35s ease}
  .lt-bar.lt-visible{opacity:1}
  .lt-headshot{width:150px;height:150px;border-radius:50%;object-fit:cover;background:#1A1A1A;
    border:5px solid #F7C600;flex:none}
  .lt-info{flex:none; min-width:0}
  .lt-name{font-family:"Anton",sans-serif;font-size:54px;line-height:1.05;color:#F7C600;white-space:nowrap;
    text-shadow:0 2px 6px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5)}
  .lt-sub{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;font-size:20px;
    color:#F5F5F0;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,.65)}
  .lt-divider{width:2px;align-self:stretch;margin:34px 0;background:rgba(0,0,0,.45);flex:none}
  .lt-stats{flex:1;min-width:0;text-align:center}
  .lt-hitline{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;font-size:18px;
    letter-spacing:.4px;color:#F5F5F0;text-transform:uppercase;margin-bottom:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.65)}
  .lt-hitline .split{color:#F7C600;font-weight:800}
  /* never wraps to a second row — sizeCells() in JS shrinks cell width + font to fit whatever
     count of stats is on screen, in one line, same as the canvas PNG export does */
  .lt-cells{display:flex;justify-content:center;align-items:flex-end;gap:0;flex-wrap:nowrap;width:100%}
  .lt-cells .lt-cell{width:150px;flex:0 0 auto;text-align:center;min-width:0}
  .lt-cell .v{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;font-size:54px;color:#F5F5F0;
    white-space:nowrap;overflow:hidden;text-shadow:0 2px 6px rgba(0,0,0,.65)}
  .lt-cell .k{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;font-size:17px;
    color:#F7C600;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;
    text-shadow:0 1px 4px rgba(0,0,0,.6)}
  /* Real Wake N Jake donut logo, extracted straight from your show art and baked in as a data URI —
     no external asset file to lose track of. */
  .lt-brand{position:absolute;right:18px;bottom:14px;height:56px;display:flex;align-items:center}
  .lt-brand img{height:100%;width:auto;display:block}
  .lt-brand img.lt-logo-missing{display:none}
  .lt-brand-fallback{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;font-size:15px;
    letter-spacing:.5px;color:#F7C600;text-transform:uppercase;white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,.6)}
  body.display-mode{background:transparent}
  body.display-mode header, body.display-mode main, body.display-mode #status,
  body.display-mode .modal-backdrop{display:none}

  span.note{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;font-size:11px;
    letter-spacing:.5px;margin-left:5px;text-transform:uppercase}
</style>
</head>
<body>
<header>
  <div class="datanote" id="datanote">Data note: <b>Live via MLB StatsAPI</b></div>
  <div class="eyebrow">Wake N Jake</div>
  <div class="titlerow">
    <h1>STAT SHEET<span>.</span></h1>
    <button id="goHome" class="home-btn" type="button" title="Back to all 30 teams">⌂ All Teams</button>
    <div class="teambadge" id="teambadge"></div>
  </div>
  <div class="controls">
    <div><label for="season">Season</label><select id="season"></select></div>
    <div><label for="division">Division</label><select id="division"><option value="">All Divisions</option></select></div>
    <div><label for="team">Team</label><select id="team"><option value="">Select a team…</option></select></div>
    <div><label for="find">Global player search</label><input id="find" type="search" placeholder="Search any MLB player…" autocomplete="off"></div>
    <div><label>OBS Display</label>
      <button id="openDisplay" type="button">Open Display ↗</button>
    </div>
  </div>
  <p class="metanote" style="margin-top:8px">Broadcast graphic looks for <code>wnj-logo.png</code> next to this file (same folder/repo) for the real logo — until it's there, it falls back to a "WAKE N JAKE" text mark.</p>
  <div class="onair" id="onair" hidden>
    <span class="onair-dot"></span>
    <span id="onairText"></span>
    <button id="onairClear" class="exit-btn" type="button" title="Remove the lower third from OBS">✕ Exit Lower Third</button>
  </div>
</header>
<div id="status">Loading…</div>
<main id="out"></main>

<div id="modalBackdrop" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <button id="modalClose" class="modal-close" type="button" aria-label="Close">×</button>
    <div class="modal-head">
      <img id="modalHeadshot" class="modal-headshot" alt="">
      <div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-sub" id="modalSub"></div>
      </div>
    </div>
    <div class="tf-pills" id="tfPills"></div>
    <div id="modalBody" class="modal-body"></div>
    <div class="modal-export-row" id="modalExportRow">
      <button id="modalDownloadBat" class="modal-export-btn" type="button" hidden
        title="Push to OBS and download hitting lower-third PNG">⤓ Download Hitting PNG</button>
      <button id="modalDownloadPit" class="modal-export-btn" type="button" hidden
        title="Push to OBS and download pitching lower-third PNG">⤓ Download Pitching PNG</button>
      <button id="modalExitOnAir" class="exit-btn" type="button"
        title="Remove the lower third from OBS">✕ Exit Lower Third</button>
    </div>
    <div id="modalDlNote" class="modal-dlnote"></div>
  </div>
</div>

<!-- OBS Browser Source view: add this same file/URL with ?display=1 as a Browser Source. -->
<div id="lowerThirdDisplay">
  <div class="lt-bar" id="ltBar">
    <img id="ltHeadshot" class="lt-headshot" alt="">
    <div class="lt-info">
      <div class="lt-name" id="ltName"></div>
      <div class="lt-sub" id="ltSub"></div>
    </div>
    <div class="lt-divider"></div>
    <div class="lt-stats">
      <div class="lt-hitline" id="ltHitline"></div>
      <div class="lt-cells" id="ltCells"></div>
    </div>
    <div class="lt-brand" id="ltBrand">
      <img id="ltLogoWnj" src="./wnj-logo.png" alt="" onerror="this.classList.add('lt-logo-missing'); document.getElementById('ltBrandFallback').style.display='';">
      <span id="ltBrandFallback" class="lt-brand-fallback" style="display:none">WAKE N JAKE</span>
    </div>
  </div>
</div>

<script>
const API = 'https://statsapi.mlb.com/api/v1';
const j = u => fetch(u).then(r => { if(!r.ok) throw new Error(u+' → '+r.status); return r.json(); });
const jCache = new Map();
const jc = u => (jCache.has(u) ? jCache.get(u) : (jCache.set(u, j(u)), jCache.get(u)));
const $ = id => document.getElementById(id);
const el = (t, cls, txt) => { const e = document.createElement(t); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; };

// ---- control ↔ display link: this same file, opened a second time with ?display=1, becomes an
// OBS Browser Source that shows whichever player was last pushed here — no server involved.
const LT_KEY = 'wnj-lower-third-onair';
const isDisplayMode = new URLSearchParams(location.search).get('display') === '1';
const ltChannel = 'BroadcastChannel' in window ? new BroadcastChannel('wnj-lower-third') : null;
if (isDisplayMode) document.body.classList.add('display-mode');

const logoURL = id => `https://www.mlbstatic.com/team-logos/${id}.svg`;
const headshotURL = pid =>
  `https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png,q_auto:best,f_auto/v1/people/${pid}/headshot/67/current`;

function say(msg, isErr) { $('status').textContent = msg || ''; $('status').className = isErr ? 'err' : ''; }

// =====================================================================================
// Teams / divisions / global player index
// =====================================================================================

let teamsById = new Map();       // id -> team object {id,name,abbreviation,division,league}
let divisions = [];              // [{league, name, short, teams:[...]}] in display order
let allPlayers = [];             // full-season player index for global search
let currentTeamId = null;
let currentView = 'directory';   // 'directory' | 'roster' | 'search'

const divShort = name => (name || '').replace('American League', 'AL').replace('National League', 'NL');

async function loadTeams(year) {
  const d = await j(`${API}/teams?sportId=1&season=${year}&activeStatus=Yes`);
  const teams = (d.teams || []).filter(t => t.division && t.league);
  teamsById = new Map(teams.map(t => [t.id, t]));

  const byDiv = new Map();
  teams.forEach(t => {
    const key = t.division.id;
    if (!byDiv.has(key)) byDiv.set(key, { league: t.league.name, name: t.division.name, short: divShort(t.division.name), teams: [] });
    byDiv.get(key).teams.push(t);
  });
  divisions = [...byDiv.values()].sort((a, b) => a.league.localeCompare(b.league) || a.name.localeCompare(b.name));
  divisions.forEach(dv => dv.teams.sort((a, b) => a.name.localeCompare(b.name)));

  $('division').innerHTML = '<option value="">All Divisions</option>' +
    divisions.map(dv => `<option value="${dv.short}">${dv.short}</option>`).join('');
  populateTeamSelect();
}

function populateTeamSelect(divShortFilter) {
  const list = divShortFilter ? divisions.filter(dv => dv.short === divShortFilter) : divisions;
  const opts = list.map(dv =>
    `<optgroup label="${dv.short}">` +

// =====================================================================================
// Roster — active / injured list / 40-man reserve, grouped, click a name to open the modal
// =====================================================================================

const POS_ORDER = { C:1, '1B':2, '2B':3, '3B':4, SS:5, LF:6, CF:7, RF:8, OF:9, DH:10, SP:11, RP:12, P:13, TWP:14 };
const posRank = p => POS_ORDER[p] ?? 50;

function classifyStatus(entry) {
  const code = entry.status && entry.status.code;
  const desc = (entry.status && entry.status.description) || '';
  if (code === 'A') return 'active';
  if (/IL|DL/i.test(desc) || /^D/.test(code || '')) return 'il';
  return 'res';
}

async function loadRoster(teamId) {
  currentTeamId = teamId; currentView = 'roster';
  const team = teamsById.get(+teamId);
  const y = $('season').value;
  setTeamBadge(team);
  $('find').value = '';
  say('Loading roster…');
  let roster = [];
  try {
    const d = await j(`${API}/teams/${teamId}/roster?rosterType=40Man&season=${y}`);
    roster = d.roster || [];
  } catch (e) { /* fall through to active */ }
  if (!roster.length) {
    try {
      const d = await j(`${API}/teams/${teamId}/roster?rosterType=active&season=${y}`);
      roster = (d.roster || []).map(r => ({ ...r, status: r.status || { code: 'A', description: 'Active' } }));
    } catch (e) { say('Could not load that roster: ' + e.message, true); return; }
  }
  say('');
  rosterState = {
    team, year: y,
    rows: roster.map(r => ({
      id: r.person.id, name: r.person.fullName, pos: (r.position && r.position.abbreviation) || '',
      number: r.jerseyNumber || '', group: classifyStatus(r),
    })),
  };
  sortState = { table: 'roster', key: null, dir: 1 };
  paintRoster();
}

// numbers sort numerically (blank last); everything else sorts as case-insensitive text
function sortRows(rows, key, dir) {
  if (!key) return rows;
  return [...rows].sort((a, b) => {
    let av = a[key], bv = b[key];
    if (key === 'number') {
      av = av === '' || av == null ? null : +av; bv = bv === '' || bv == null ? null : +bv;
      if (av === null && bv === null) return 0;
      if (av === null) return 1; if (bv === null) return -1;
      return (av - bv) * dir;
    }
    av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase();
    if (av < bv) return -1 * dir; if (av > bv) return 1 * dir; return 0;
  });
}

// stamp a header cell as sortable and light it up if it's the active sort column
function sortableTh(label, key, tbl) {
  const th = el('th', null, label);
  th.dataset.key = key; th.dataset.tbl = tbl;
  if (sortState.table === tbl && sortState.key === key) th.classList.add(sortState.dir === 1 ? 'sort-asc' : 'sort-desc');
  return th;
}

function paintRoster() {
  if (!rosterState) return;
  const { team, year, rows } = rosterState;
  currentIndex = new Map();
  rows.forEach(r => currentIndex.set(String(r.id), { id: r.id, name: r.name, pos: r.pos, team: team ? team.name : '', teamId: team ? team.id : null }));

  const groups = [
    ['active', 'ACTIVE ROSTER'],
    ['il', 'INJURED LIST'],
    ['res', '40-MAN / RESERVE'],
  ];
  const table = el('table', 'players');
  const thead = el('thead'); const hr = el('tr');
  hr.appendChild(sortableTh('#', 'number', 'roster'));
  hr.appendChild(sortableTh('Name', 'name', 'roster'));
  hr.appendChild(sortableTh('Pos', 'pos', 'roster'));
  hr.appendChild(sortableTh('Status', 'group', 'roster'));
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = el('tbody');
  const active = sortState.table === 'roster' ? sortState : null;
  groups.forEach(([key, label]) => {
    let g = rows.filter(r => r.group === key);
    g = active && active.key
      ? sortRows(g, active.key, active.dir)
      : g.sort((a, b) => posRank(a.pos) - posRank(b.pos) || a.name.localeCompare(b.name));
    if (!g.length) return;
    const trG = el('tr', 'group');
    const tdG = el('td', null, `${label} (${g.length})`); tdG.colSpan = 4;
    trG.appendChild(tdG); tbody.appendChild(trG);
    g.forEach(r => {
      const tr = el('tr'); tr.dataset.pid = r.id;
      tr.appendChild(el('td', 'num', r.number));
      tr.appendChild(el('td', 'name', r.name));
      tr.appendChild(el('td', null, r.pos));
      const badgeCls = key === 'active' ? 'active' : key === 'il' ? 'il' : 'res';
      const badgeText = key === 'active' ? 'Active' : key === 'il' ? 'Injured List' : 'Reserve';
      tr.appendChild(el('td', null, '')).innerHTML = `<span class="badge ${badgeCls}">${badgeText}</span>`;
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  addTable(`${team ? team.name : 'Team'} Roster — ${year}`, table);
}

function addTable(title, table, note) {
  const out = $('out'); out.innerHTML = '';
  out.appendChild(el('h2', null, title));
  if (note) out.appendChild(el('div', 'metanote', note));
  if (table) { const w = el('div', 'wrap'); w.appendChild(table); out.appendChild(w); }
}

let currentIndex = new Map(); // pid -> {id,name,pos,team,teamId}, used by the player modal
let rosterState = null;       // {team, year, rows} — cached so column-header sorts don't refetch
let searchState = null;       // {query, teamGroups, total, limit} — same, for search results
let sortState = { table: null, key: null, dir: 1 };

function renderSearchResults(query) {
  const q = query.trim().toLowerCase();
  if (!q) { searchState = null; renderDirectory($('division').value); return; }
  currentView = 'search';
  setTeamBadge(null);
  const matches = allPlayers.filter(p => p.name.toLowerCase().includes(q));
  say('');
  if (!matches.length) { searchState = null; addTable(`Search — "${query}"`, null, 'No players matched that search.'); return; }

  const LIMIT = 80;
  const shown = matches.slice(0, LIMIT);
  const byTeam = new Map();
  shown.forEach(p => {
    if (!byTeam.has(p.teamId)) byTeam.set(p.teamId, []);
    byTeam.get(p.teamId).push(p);
  });
  const teamGroups = [...byTeam.entries()]
    .map(([tid, players]) => ({ team: teamsById.get(tid), players }))
    .sort((a, b) => (a.team ? a.team.name : '').localeCompare(b.team ? b.team.name : ''));

  searchState = { query, teamGroups, total: matches.length, limit: LIMIT };
  sortState = { table: 'search', key: null, dir: 1 };
  paintSearch();
}

function paintSearch() {
  if (!searchState) return;
  const { query, teamGroups, total, limit } = searchState;
  currentIndex = new Map();
  const table = el('table', 'players');
  const thead = el('thead'); const hr = el('tr');
  hr.appendChild(sortableTh('#', 'number', 'search'));
  hr.appendChild(sortableTh('Name', 'name', 'search'));

  hr.appendChild(sortableTh('Team', 'teamName', 'search'));
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = el('tbody');
  const active = sortState.table === 'search' ? sortState : null;
  teamGroups.forEach(({ team, players }) => {

    const tdG = el('td', null, team ? team.name : 'Unknown Team'); tdG.colSpan = 4;
    trG.appendChild(tdG); tbody.appendChild(trG);
    const rows = active && active.key ? sortRows(players, active.key, active.dir)
                                       : [...players].sort((a, b) => a.name.localeCompare(b.name));
    rows.forEach(p => {
      currentIndex.set(String(p.id), { id: p.id, name: p.name, pos: p.pos, team: p.teamName, teamId: p.teamId });
      const tr = el('tr'); tr.dataset.pid = p.id;

  addTable(`Search — "${query}"`, table, total > limit ? `Showing first ${limit} of ${total} matches — refine your search to narrow it down.` : '');
}

// =====================================================================================
// Player modal — timeframe pills (Full Season / Last 7 / 14 / 30 days), hitting + pitching
// =====================================================================================

const TF = [
  ['season', 'FULL SEASON'],
  ['7', 'LAST 7 DAYS'],
  ['14', 'LAST 14 DAYS'],
  ['30', 'LAST 30 DAYS'],
  ['vl', 'VS LEFTIES'],
  ['vr', 'VS RIGHTIES'],
];
const isSplitTf = tf => tf === 'vl' || tf === 'vr';
let modalPid = null, modalRow = null, modalTf = 'season';
let modalBat = null, modalPit = null;  // currently-loaded stat objects for the active timeframe

// K% (strikeout rate) isn't a field the API hands back pre-computed, but every stat shape we use —
// season, byDateRange, and the vs-L/R splits — carries the raw counts to derive it ourselves.
const kPct = (k, denom) => denom ? (k / denom * 100).toFixed(1) + '%' : '–';

function statGrid(pairs) {
  return `<div class="stat-grid">` + pairs.map(([k, v]) =>
    `<div class="cell"><div class="v">${v != null && v !== '' ? v : '–'}</div><div class="k">${k}</div></div>`).join('') + `</div>`;
}
function apiBattingBlock(st) {
  if (!st) return `<div class="modal-empty">No hitting stats for this range.</div>`;
  const cells = [['HR', st.homeRuns], ['RBI', st.rbi], ['BB', st.baseOnBalls],
                 ['K', st.strikeOuts], ['SB', st.stolenBases], ['HBP', st.hitByPitch],
                 ['K%', kPct(st.strikeOuts, st.plateAppearances)]];
  return `<div class="modal-hitline">${st.hits}-for-${st.atBats}</div>`
    + `<div class="modal-line">${st.avg} / ${st.obp} / ${st.slg} / ${st.ops} <span style="color:var(--dim);font-weight:400">AVG/OBP/SLG/OPS</span></div>`
    + statGrid(cells);
}
function apiPitchingBlock(st) {
  if (!st) return `<div class="modal-empty">No pitching stats for this range.</div>`;
  return `<div class="modal-line">${st.inningsPitched} IP · ${st.era} ERA · ${st.wins}-${st.losses}</div>`
    + statGrid([['WHIP', st.whip], ['K', st.strikeOuts], ['BB', st.baseOnBalls],
                ['SV', st.saves], ['ER', st.earnedRuns], ['K%', kPct(st.strikeOuts, st.battersFaced)]]);
}
// vs-lefties/vs-righties pitching splits come back as a "batters faced" line, not a game record —
// no ERA, no W-L, no saves (those aren't a real concept split by opposing-batter handedness).
function apiPitchingSplitBlock(st) {
  if (!st) return `<div class="modal-empty">No pitching stats for this range.</div>`;
  return `<div class="modal-hitline">${st.hits}-for-${st.atBats} allowed</div>`
    + `<div class="modal-line">${st.inningsPitched} IP · ${st.whip} WHIP · ${st.avg} BAA</div>`
    + statGrid([['K', st.strikeOuts], ['BB', st.baseOnBalls], ['HR', st.homeRuns],
                ['H', st.hits], ['BF', st.battersFaced], ['K%', kPct(st.strikeOuts, st.battersFaced)]]);
}

function fmtDate(d) { return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`; }
function dateRangeForDays(n) {
  const end = new Date(); const start = new Date(); start.setDate(start.getDate() - n);
  return { startDate: fmtDate(start), endDate: fmtDate(end) };
}
// group is 'hitting' | 'pitching' | omitted — the vs-L/R label reads differently depending on
// which side of the ball it's describing (a hitter faces LHP, a pitcher faces LHB)
function tfLabel(tf, year, group) {
  if (tf === 'season') return `${year} SEASON`;
  if (tf === 'vl') return group === 'pitching' ? 'VS LHB' : 'VS LHP';
  if (tf === 'vr') return group === 'pitching' ? 'VS RHB' : 'VS RHP';
  return `LAST ${tf} DAYS`;
}

async function fetchStat(pid, group, tf, year) {
  let url;
  if (tf === 'season') {
    url = `${API}/people/${pid}/stats?stats=season&season=${year}&group=${group}`;
  } else if (isSplitTf(tf)) {
    url = `${API}/people/${pid}/stats?stats=statSplits&sitCodes=${tf}&season=${year}&group=${group}`;
  } else {
    const { startDate, endDate } = dateRangeForDays(+tf);
    url = `${API}/people/${pid}/stats?stats=byDateRange&startDate=${startDate}&endDate=${endDate}&season=${year}&group=${group}`;
  }
  const d = await jc(url);
  const sec = (d.stats || [])[0];
  return sec && sec.splits && sec.splits.length ? sec.splits[0].stat : null;
}

function wantsBatting(row) { return row.pos !== 'P'; }
function wantsPitching(row) { return row.pos === 'P' || row.pos === 'TWP'; }

async function openPlayerModal(pid) {
  const row = currentIndex.get(String(pid));
  if (!row) return;
  modalPid = pid; modalRow = row; modalTf = 'season';
  $('modalDlNote').textContent = '';
  $('modalHeadshot').src = headshotURL(pid);
  $('modalName').textContent = row.name;
  $('modalSub').textContent = [row.pos, row.team].filter(Boolean).join(' · ');
  $('modalBackdrop').hidden = false;
  paintTfPills();
  await loadModalStats();
}

function paintTfPills() {
  const box = $('tfPills'); box.innerHTML = '';
  TF.forEach(([key, label]) => {
    const b = el('button', 'tf-pill' + (key === modalTf ? ' on' : ''), label);
    b.type = 'button';
    b.onclick = () => { modalTf = key; paintTfPills(); loadModalStats(); };
    box.appendChild(b);
  });
}

async function loadModalStats() {
  const pid = modalPid, row = modalRow, tf = modalTf;
  const year = $('season').value;
  $('modalBody').innerHTML = `<div class="modal-empty">Loading ${tfLabel(tf, year).toLowerCase()}…</div>`;
  const doBat = wantsBatting(row), doPit = wantsPitching(row);
  const [bat, pit] = await Promise.all([
    doBat ? fetchStat(pid, 'hitting', tf, year).catch(() => null) : Promise.resolve(null),
    doPit ? fetchStat(pid, 'pitching', tf, year).catch(() => null) : Promise.resolve(null),
  ]);
  if (modalPid !== pid || modalTf !== tf) return; // selection changed mid-flight
  modalBat = bat; modalPit = pit;

  const parts = [];
  if (doBat) parts.push([`${tfLabel(tf, year, 'hitting')} · Hitting`, apiBattingBlock(bat)]);
  if (doPit) parts.push([`${tfLabel(tf, year, 'pitching')} · Pitching`, isSplitTf(tf) ? apiPitchingSplitBlock(pit) : apiPitchingBlock(pit)]);
  $('modalBody').innerHTML = parts.length
    ? parts.map(([t, html]) => `<div class="modal-section"><h3>${t}</h3>${html}</div>`).join('')
    : `<div class="modal-empty">No stats available for this range.</div>`;

  $('modalDownloadBat').hidden = !(bat && +bat.atBats > 0);
  $('modalDownloadPit').hidden = !(pit && (+pit.outs > 0 || +pit.battersFaced > 0 || +pit.gamesPlayed > 0));

  autoPushOnAir();
}

function closeModal() { $('modalBackdrop').hidden = true; }

// =====================================================================================
// Broadcast graphic: a lower-third PNG, drawn on canvas so it needs no external assets
// =====================================================================================

function battingGraphicData(st, label) {
  if (!st) return null;
  const cells = [['AVG', st.avg], ['OBP', st.obp], ['SLG', st.slg], ['OPS', st.ops], ['HR', st.homeRuns], ['RBI', st.rbi],
                 ['K%', kPct(st.strikeOuts, st.plateAppearances)]];
  return { label, hitLine: `${st.hits}-for-${st.atBats}`, cells };
}
function pitchingGraphicData(st, label) {
  if (!st) return null;
  return { label, hitLine: `${st.gamesPlayed || 0} G${st.gamesStarted ? ' · ' + st.gamesStarted + ' GS' : ''}`, cells: [
    ['ERA', st.era], ['WHIP', st.whip], ['IP', st.inningsPitched], ['K', st.strikeOuts], ['BB', st.baseOnBalls],
    ['W-L', `${st.wins}-${st.losses}`], ['K%', kPct(st.strikeOuts, st.battersFaced)] ] };
}
// vs-L/R pitching splits have no ERA/W-L/saves (not a real concept for that split), so swap in
// what the API actually gives us: IP/WHIP/K/BB plus the opposing batting line (BAA/HR)
function pitchingSplitGraphicData(st, label) {
  if (!st) return null;
  return { label, hitLine: `${st.battersFaced || 0} BF`, cells: [
    ['IP', st.inningsPitched], ['WHIP', st.whip], ['K', st.strikeOuts], ['BB', st.baseOnBalls], ['BAA', st.avg],
    ['HR', st.homeRuns], ['K%', kPct(st.strikeOuts, st.battersFaced)] ] };
}

// Real Wake N Jake logo lives at ./wnj-logo.png, next to this file (drop it in the same
// GitHub repo / folder). Falls back to a gold text mark if that file isn't there yet.
const WNJ_LOGO_URL = './wnj-logo.png';
let wnjLogoImgPromise = null;

async function drawBrandLockup(ctx, W, H) {
  const dockH = 56, bottomY = H - 14, rightMargin = 18;
  wnjLogoImgPromise = wnjLogoImgPromise || loadSafeImage(WNJ_LOGO_URL);
  const wnj = await wnjLogoImgPromise;
  if (!wnj) {
    ctx.textAlign = 'right'; ctx.fillStyle = '#F7C600'; ctx.font = '800 15px "Sofia Sans Extra Condensed"';
    ctx.fillText('WAKE N JAKE', W - rightMargin, bottomY);
    return;
  }
  const h = dockH, w = wnj.width * (h / wnj.height);
  ctx.drawImage(wnj, W - rightMargin - w, bottomY - h, w, h);
}

// Rounded-rect path helper for the gold-bordered broadcast panel
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function loadSafeImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const t = document.createElement('canvas'); t.width = t.height = 2;
        t.getContext('2d').drawImage(img, 0, 0, 2, 2);
        t.toDataURL();
        resolve(img);
      } catch { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function renderLowerThird(data, row, pid) {
  await Promise.all([
    document.fonts.load('64px Anton'),
    document.fonts.load('700 18px "Sofia Sans Extra Condensed"'),
    document.fonts.load('800 40px "Sofia Sans Extra Condensed"'),
  ]);
  const img = await loadSafeImage(headshotURL(pid));

  const CW = 1920, CH = 1080, W = 1920, H = 200, BOTTOM_MARGIN = 60;
  const canvas = document.createElement('canvas'); canvas.width = CW; canvas.height = CH;
  const ctx = canvas.getContext('2d');
  ctx.translate(0, CH - H - BOTTOM_MARGIN);

  const bw = 6, radius = 18;
  roundRectPath(ctx, bw / 2, bw / 2, W - bw, H - bw, radius);
  ctx.fillStyle = '#17AE6C'; ctx.fill();
  ctx.lineWidth = bw; ctx.strokeStyle = '#F7C600'; ctx.stroke();

  const cx = 112, cy = H / 2, r = 75;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.closePath();
  if (img) {
    ctx.save(); ctx.clip();
    const size = r * 2, scale = Math.max(size / img.width, size / img.height);
    const iw = img.width * scale, ih = img.height * scale;
    ctx.drawImage(img, cx - iw / 2, cy - ih / 2, iw, ih);
    ctx.restore();
  } else {
    ctx.fillStyle = '#1A1A1A'; ctx.fill();
    ctx.fillStyle = '#F7C600'; ctx.font = '700 16px "Sofia Sans Extra Condensed"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('NO PHOTO', cx, cy);
  }
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.lineWidth = 5; ctx.strokeStyle = '#F7C600'; ctx.stroke();

  const nx = 226;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#F7C600'; ctx.font = '62px Anton';
  ctx.fillText(row.name.toUpperCase(), nx, 124);
  ctx.fillStyle = '#F5F5F0'; ctx.font = '700 20px "Sofia Sans Extra Condensed"';
  ctx.fillText([row.pos, row.team].filter(Boolean).join('  ·  ').toUpperCase(), nx, 156);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  const divX = 800;
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(divX, 34); ctx.lineTo(divX, H - 34); ctx.stroke();

  const startX = divX + 30, avail = W - 30 - startX;
  const cellW = Math.min(150, avail / data.cells.length);
  const groupW = cellW * data.cells.length, groupStart = startX + (avail - groupW) / 2;

  // split label (e.g. "LAST 30 DAYS") in white, the counting line (e.g. "12-FOR-72") faded next to it
  const splitText = data.label ? data.label.toUpperCase() : '';
  const subText = data.hitLine ? data.hitLine.toUpperCase() : '';
  ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  if (splitText) {
    let fs = 26;
    const measure = size => {
      ctx.font = `800 ${size}px "Sofia Sans Extra Condensed"`;
      const w1 = ctx.measureText(splitText).width;
      ctx.font = `700 ${size}px "Sofia Sans Extra Condensed"`;
      const w2 = subText ? ctx.measureText('   ·   ' + subText).width : 0;
      return w1 + w2;
    };
    while (fs > 14 && measure(fs) > groupW) fs -= 1;
    const totalW = measure(fs);
    let x = groupStart + groupW / 2 - totalW / 2;
    ctx.textAlign = 'left';
    ctx.font = `800 ${fs}px "Sofia Sans Extra Condensed"`;
    ctx.fillStyle = '#F7C600';
    ctx.fillText(splitText, x, 44);
    x += ctx.measureText(splitText).width;
    if (subText) {
      ctx.font = `700 ${fs}px "Sofia Sans Extra Condensed"`;
      ctx.fillStyle = '#F5F5F0';
      ctx.fillText('   ·   ' + subText, x, 44);
    }
  }
  const valueSize = data.cells.length > 6 ? 68 : 80, labelSize = data.cells.length > 6 ? 22 : 26;
  data.cells.forEach(([label, value], i) => {
    const x = groupStart + i * cellW + cellW / 2;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#F5F5F0';
    let vs = valueSize;
    ctx.font = `800 ${vs}px "Sofia Sans Extra Condensed"`;
    while (vs > 26 && ctx.measureText(String(value)).width > cellW - 10)
      ctx.font = `800 ${vs -= 2}px "Sofia Sans Extra Condensed"`;
    ctx.fillText(String(value), x, H / 2 + 16);
    ctx.fillStyle = '#F7C600'; ctx.font = `700 ${labelSize}px "Sofia Sans Extra Condensed"`;
    ctx.fillText(label, x, H / 2 + 50);
  });
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  await drawBrandLockup(ctx, W, H);

  return { canvas, hadPhoto: !!img };
}

// ---- on-air: push a player's stat line to the OBS display view (control side) ----

let onAirPid = null, onAirKind = null;

function pushOnAir(pid, kind, row, data) {
  if (!row || !data) return;
  onAirPid = pid; onAirKind = kind;
  const payload = { pid, kind, name: row.name, pos: row.pos, team: row.team, data, ts: Date.now() };
  try { localStorage.setItem(LT_KEY, JSON.stringify(payload)); } catch {}
  if (ltChannel) ltChannel.postMessage(payload);
  updateOnAirUI(payload);
}

function clearOnAir() {
  onAirPid = onAirKind = null;
  try { localStorage.removeItem(LT_KEY); } catch {}
  if (ltChannel) ltChannel.postMessage({ clear: true });
  updateOnAirUI(null);
}

function updateOnAirUI(payload) {
  const box = $('onair'); if (!box) return;
  box.hidden = !payload;
  if (payload) $('onairText').innerHTML = `On air: <b>${payload.name}</b> · ${payload.data.label}`;
}

// Whenever the modal opens or the timeframe changes, auto-push whichever line is primary
// (hitting for position players, pitching for pitchers) so the OBS bar always tracks what's on screen.
function autoPushOnAir() {
  if (!modalPid || !modalRow) return;
  const year = $('season').value;
  const pitFn = isSplitTf(modalTf) ? pitchingSplitGraphicData : pitchingGraphicData;
  if (wantsPitching(modalRow) && !wantsBatting(modalRow)) {
    const data = pitFn(modalPit, tfLabel(modalTf, year, 'pitching'));
    if (data) pushOnAir(modalPid, 'pit', modalRow, data);
  } else {
    const batData = battingGraphicData(modalBat, tfLabel(modalTf, year, 'hitting'));
    const data = batData || pitFn(modalPit, tfLabel(modalTf, year, 'pitching'));
    if (data) pushOnAir(modalPid, data === batData ? 'bat' : 'pit', modalRow, data);
  }
}

// matches the CSS transition duration on .lt-bar, so a player-to-player swap fades the old one
// fully out before the new content is painted and faded back in — never an instant content pop
const LT_FADE_MS = 350;
let ltFadeTimer = null;
let ltVisible = false;

function paintOnAirBar(payload) {
  const { name, pos, team, data } = payload;
  $('ltHeadshot').src = headshotURL(payload.pid);
  $('ltName').textContent = name.toUpperCase();
  $('ltSub').textContent = [pos, team].filter(Boolean).join('  ·  ').toUpperCase();
  const hitEl = $('ltHitline');
  const splitText = data.label ? data.label.toUpperCase() : '';
  const subText = data.hitLine ? data.hitLine.toUpperCase() : '';
  hitEl.innerHTML = splitText ? `<span class="split">${splitText}</span>${subText ? '  ·  ' + subText : ''}` : '';
  hitEl.style.display = splitText ? '' : 'none';
  $('ltCells').innerHTML = data.cells.map(([label, value]) =>
    `<div class="lt-cell"><div class="v">${value}</div><div class="k">${label}</div></div>`).join('');
  sizeCells(data.cells.length);
  $('ltBar').classList.add('lt-visible');
  ltVisible = true;
}

function renderOnAirBar(payload) {
  const bar = $('ltBar');
  if (!bar) return;
  clearTimeout(ltFadeTimer);

  if (!payload) {
    bar.classList.remove('lt-visible');  // fades out via the CSS transition, content stays as-is underneath
    ltVisible = false;
    return;
  }

  if (ltVisible) {
    // already on screen with someone else — fade that out first, then swap content and fade the new one in
    bar.classList.remove('lt-visible');
    ltFadeTimer = setTimeout(() => paintOnAirBar(payload), LT_FADE_MS);
  } else {
    paintOnAirBar(payload);
  }
}

// Shrinks each stat cell (width + font) to whatever fits the available bar width in one row —
// mirrors the shrink-to-fit the canvas PNG export already does, so the live OBS bar never wraps
// to a second line no matter how many cells a timeframe adds.
function sizeCells(n) {
  const wrap = $('ltCells');
  if (!wrap || !n) return;
  const avail = wrap.clientWidth || n * 150;
  const w = Math.max(64, Math.min(150, Math.floor(avail / n)));
  const tight = w < 130, veryTight = w < 90;
  const valueFs = veryTight ? 30 : tight ? 38 : 54;
  const keyFs = veryTight ? 11 : tight ? 13 : 17;
  wrap.querySelectorAll('.lt-cell').forEach(cell => {
    cell.style.width = w + 'px';
    const v = cell.querySelector('.v'), k = cell.querySelector('.k');
    if (v) v.style.fontSize = valueFs + 'px';
    if (k) k.style.fontSize = keyFs + 'px';
  });
}

function initDisplay() {
  try {
    const cached = JSON.parse(localStorage.getItem(LT_KEY) || 'null');
    if (cached) renderOnAirBar(cached);
  } catch {}
  if (ltChannel) ltChannel.onmessage = e => renderOnAirBar(e.data && e.data.clear ? null : e.data);
  window.addEventListener('storage', e => {
    if (e.key !== LT_KEY) return;
    try { renderOnAirBar(e.newValue ? JSON.parse(e.newValue) : null); } catch {}
  });
}

async function downloadGraphic(kind) {  // kind: 'bat' | 'pit'
  const pid = modalPid, row = modalRow;
  const btn = $(kind === 'bat' ? 'modalDownloadBat' : 'modalDownloadPit'), note = $('modalDlNote');
  if (!row) return;
  const year = $('season').value;
  const pitFn = isSplitTf(modalTf) ? pitchingSplitGraphicData : pitchingGraphicData;
  const data = kind === 'bat' ? battingGraphicData(modalBat, tfLabel(modalTf, year, 'hitting'))
                               : pitFn(modalPit, tfLabel(modalTf, year, 'pitching'));
  if (!data) { note.textContent = `No ${kind === 'bat' ? 'hitting' : 'pitching'} stats available to build a graphic yet.`; return; }

  btn.disabled = true; note.textContent = `Building graphic…`;
  try {
    pushOnAir(pid, kind, row, data);
    const { canvas, hadPhoto } = await renderLowerThird(data, row, pid);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (!blob) throw new Error('Canvas export failed');
    const a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${row.name.replace(/[^\w\d]+/g, '-')}-${kind}-${modalTf}-lower-third.png`;
    a.click(); URL.revokeObjectURL(a.href);
    note.textContent = hadPhoto ? 'Pushed to OBS + downloaded ✓' : 'Pushed to OBS + downloaded ✓ (headshot host blocked embedding — graphic saved without it)';
  } catch (e) {
    note.textContent = 'Could not build the graphic: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

// =====================================================================================
// Wiring
// =====================================================================================

const guard = fn => (...a) => Promise.resolve(fn(...a)).catch(e => say(e.message, true));

let searchDebounce = null;
$('find').oninput = () => {
  clearTimeout(searchDebounce);
  const q = $('find').value;
  searchDebounce = setTimeout(() => guard(async () => renderSearchResults(q))(), 150);
};

$('division').onchange = () => {
  const dv = $('division').value;
  populateTeamSelect(dv);
  $('team').value = '';
  $('find').value = '';
  renderDirectory(dv);
};
$('goHome').onclick = () => {
  $('division').value = '';
  populateTeamSelect('');
  $('team').value = '';
  $('find').value = '';
  currentTeamId = null;
  renderDirectory();
};
$('team').onchange = () => {
  const id = $('team').value;
  $('find').value = '';
  if (id) guard(loadRoster)(+id);
  else renderDirectory($('division').value);
};
$('season').onchange = guard(async () => {
  await Promise.all([loadTeams($('season').value), loadPlayerIndex($('season').value)]);
  if (currentView === 'roster' && currentTeamId) guard(loadRoster)(currentTeamId);
  else renderDirectory($('division').value);
});

$('out').onclick = e => {
  const th = e.target.closest('thead th[data-key]');
  if (th) {
    const { key, tbl } = th.dataset;
    const same = sortState.table === tbl && sortState.key === key;
    sortState = { table: tbl, key, dir: same ? -sortState.dir : 1 };
    if (tbl === 'roster') paintRoster(); else paintSearch();
    return;
  }
  const tr = e.target.closest('tbody tr');
  if (!tr || tr.classList.contains('group') || !tr.dataset.pid) return;
  openPlayerModal(tr.dataset.pid);
};
$('modalClose').onclick = closeModal;
$('modalDownloadBat').onclick = () => downloadGraphic('bat');
$('modalDownloadPit').onclick = () => downloadGraphic('pit');
$('modalBackdrop').onclick = e => { if (e.target.id === 'modalBackdrop') closeModal(); };
document.onkeydown = e => { if (e.key === 'Escape' && !$('modalBackdrop').hidden) closeModal(); };
$('openDisplay').onclick = () => {
  const url = new URL(location.href); url.searchParams.set('display', '1');
  window.open(url.href, '_blank');
};
$('onairClear').onclick = clearOnAir;
$('modalExitOnAir').onclick = () => {
  clearOnAir();
  $('modalDlNote').textContent = 'Removed from OBS ✓';
};

const yr = new Date().getFullYear();
if (isDisplayMode) {
  initDisplay();
} else {
  $('season').innerHTML = Array.from({length: yr - 2013}, (_, i) => yr - i).map(y => `<option>${y}</option>`).join('');
  guard(async () => {
    say('Loading teams…');
    await Promise.all([loadTeams($('season').value), loadPlayerIndex($('season').value)]);
    say('');
    renderDirectory();
  })();
}
</script>
