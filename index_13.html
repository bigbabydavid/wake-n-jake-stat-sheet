<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stat Sheet — Wake N Jake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sofia+Sans+Extra+Condensed:wght@700;800&family=Sofia+Sans+Semi+Condensed:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fff; --chrome:#F7F7F7; --ink:#1F1F1F; --dim:#6B6B6B;
    --grid:#B7B7B7; --hard:#7F7F7F;
    --red:#B3261E; --blue:#1F4E79; --green:#217346;
    --team:#D9D9D9; --sum:#E6E6E6; --sub:#EFEFEF;
    /* Wake N Jake brand — colors sampled directly from show graphics.
       Admin UI uses a darkened, accessible shade of the brand green (the true brand
       green/gold only read correctly against dark backgrounds, per the reference art,
       so the broadcast graphic below uses the real values on black; this darker --accent
       is a same-family shade for links/buttons/labels on the white control panel). */
    --accent:#0E6E44; --accent-hover:#0A5535;
    --wnj-green:#17AE6C; --wnj-gold:#F7C600; --wnj-black:#0A0A0A; --white-accent:#F5F5F0;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--paper);
    font-family:"Sofia Sans Semi Condensed",Roboto,system-ui,sans-serif}
  header{padding:14px 20px 12px;border-bottom:2px solid var(--hard);background:var(--chrome);
    position:sticky;top:0;z-index:40}
  .eyebrow{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;text-transform:uppercase;
    font-size:12px;letter-spacing:2px;color:var(--dim);margin:0 0 4px}
  .eyebrow::before{content:"— ";color:var(--accent)}
  .titlerow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-family:"Anton",sans-serif;font-style:normal;font-size:34px;margin:0;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .home-btn{background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:999px;
    padding:6px 14px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.6px;font-size:12.5px;cursor:pointer;flex:none}
  .home-btn:hover{background:var(--accent);color:#fff}
  .teambadge{display:flex;align-items:center;gap:8px}
  .teambadge img{width:30px;height:30px;border-radius:50%;background:#fff;padding:3px;
    box-shadow:0 0 0 1px var(--grid);object-fit:contain}
  .teambadge .tn{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.4px;color:var(--dim);font-size:13px}
  .datanote{position:absolute;top:14px;right:20px;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-size:11px;letter-spacing:.4px;color:var(--dim);background:#fff;border:1px solid var(--grid);
    border-radius:4px;padding:5px 9px;text-transform:uppercase}
  .datanote b{color:var(--ink);font-weight:800}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}
  label{display:block;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;font-size:12px;letter-spacing:1px;color:var(--accent);margin-bottom:3px}
  select,input{background:#fff;color:var(--ink);border:1px solid var(--grid);border-radius:4px;
    padding:7px 9px;font-family:inherit;font-size:15px;max-width:min(60vw,520px)}
  select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
  input::placeholder{color:#a8a8a8}
  #status{padding:14px 20px;color:var(--dim)}
  #status.err{color:var(--red)}
  #status:empty{display:none}
  main{padding:0 20px 60px}
  h2{font-family:"Anton",sans-serif;font-style:normal;font-size:21px;margin:24px 0 7px;letter-spacing:.5px;
    text-transform:uppercase;color:var(--accent)}
  .wrap{overflow-x:auto;border:1px solid var(--hard);background:#fff}

  table{border-collapse:separate;border-spacing:0;font-size:14px;width:100%}
  th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid)}
  thead th{position:sticky;top:0;background:#fff;z-index:10;
    font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.6px;font-size:12px;color:var(--accent)}
  thead th[data-key]{cursor:pointer;user-select:none}
  thead th[data-key]:hover{background:#EAF3EC}
  thead th[data-key].sort-asc,thead th[data-key].sort-desc{background:#EAF3EC;color:var(--blue)}
  thead th[data-key].sort-asc::after{content:" ▲";font-size:9px}
  thead th[data-key].sort-desc::after{content:" ▼";font-size:9px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  tr.group td{background:var(--team);font-family:"Anton",sans-serif;font-style:normal;
    font-size:15px;color:var(--blue);letter-spacing:.5px;padding:6px 10px;
    text-transform:uppercase;border-bottom:1px solid var(--hard)}
  table.players tbody tr:not(.group){cursor:pointer}
  table.players tbody tr:not(.group):hover td{background:#E4E4E4}
  table.players td.name{font-weight:700}
  table.players td.name:hover{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-weight:800;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
  .badge.active{background:#E3F2E3;color:var(--green)}
  .badge.il{background:#FBE1E1;color:var(--red)}
  .badge.res{background:#EFEFEF;color:var(--dim)}
  .metanote{color:var(--dim);font-size:13px;margin:0 0 10px}

  /* ---- team directory (default browse view) ---- */
  .leaguehead{font-family:"Anton",sans-serif;font-size:18px;letter-spacing:.5px;color:var(--blue);
    text-transform:uppercase;margin:22px 0 4px}
  .divhead{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;text-transform:uppercase;
    font-size:12px;letter-spacing:1.4px;color:var(--accent);margin:14px 0 6px}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:6px}
  .team-card{display:flex;align-items:center;gap:9px;border:1px solid var(--grid);border-radius:6px;
    padding:8px 10px;background:#fff;cursor:pointer;text-align:left}
  .team-card:hover{border-color:var(--accent);background:#EFF7F1}
  .team-card img{width:28px;height:28px;object-fit:contain;flex:none}
  .team-card .tname{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;font-size:13px;
    text-transform:uppercase;letter-spacing:.3px;line-height:1.2}
  .team-card .tcount{margin-left:auto;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    font-size:12px;color:var(--dim);letter-spacing:.3px}
  /* segmented control for choosing HOW to browse to a player */
  .seg{display:inline-flex;border:1px solid var(--grid);border-radius:999px;overflow:hidden;background:#fff}
  .seg button{border:0;border-radius:0;padding:7px 14px;background:#fff;color:var(--dim);
    font-size:12.5px;letter-spacing:.6px}
  .seg button + button{border-left:1px solid var(--grid)}
  .seg button:hover{background:#EFF7F1;color:var(--accent)}
  .seg button.on{background:var(--accent);color:#fff}
  .poshead{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;text-transform:uppercase;
    font-size:12px;letter-spacing:1.4px;color:var(--accent);margin:14px 0 6px}
  /* --- FanGraphs-style abbreviation bar: every team, alphabetical, split by league --- */
  .abbrbar{border-left:4px solid var(--accent);background:var(--chrome);padding:10px 14px;margin:14px 0 18px}
  .abbrbar .lg{font-weight:800;font-size:14px;text-decoration:underline;margin:2px 0 4px}
  .abbrbar .row{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:8px}
  .abbrbar .row:last-child{margin-bottom:0}
  .abbrbar button{background:transparent;border:0;border-radius:4px;padding:4px 9px;color:var(--ink);
    font-family:"Sofia Sans Semi Condensed",sans-serif;font-weight:600;font-size:17px;
    letter-spacing:.3px;text-transform:none;cursor:pointer}
  .abbrbar button:hover{background:#fff;color:var(--accent);text-decoration:underline}
  /* --- Baseball-Reference-style standings: two league columns, divisions stacked --- */
  .stand-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;max-width:900px}
  .stand table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--grid)}
  .stand th,.stand td{padding:4px 8px;border-bottom:1px solid var(--grid);font-size:14px}
  .stand thead th{background:var(--chrome);color:var(--accent);font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-weight:800;text-transform:uppercase;letter-spacing:.5px;font-size:12px;text-align:right}
  .stand thead th:first-child{text-align:left}
  .stand tr.divrow td{background:var(--team);font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-weight:800;text-transform:uppercase;letter-spacing:.6px;font-size:12.5px;color:var(--ink)}
  .stand td.num{text-align:right;font-variant-numeric:tabular-nums}
  .stand tbody tr.teamrow{cursor:pointer}
  .stand tbody tr.teamrow:hover td{background:#EFF7F1}
  .stand .tlink{color:var(--blue);font-weight:700}
  .stand tbody tr.teamrow:hover .tlink{color:var(--accent);text-decoration:underline}

  button{background:#fff;color:var(--ink);border:1px solid var(--grid);border-radius:4px;
    padding:7px 11px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.8px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.4;cursor:default;border-color:var(--grid);color:var(--ink)}
  @media (max-width:640px){
    .datanote{position:static;display:inline-block;margin:0 0 8px}
    h1{font-size:28px}
  }

  /* ---- player modal ---- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(40,40,40,.5);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-backdrop[hidden]{display:none}
  .modal{background:#fff;border:1px solid var(--hard);border-radius:6px;max-width:760px;
    width:100%;max-height:88vh;overflow:auto;padding:20px;position:relative;
    box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal-close{position:absolute;top:10px;right:10px;background:#fff;border:1px solid var(--grid);
    color:var(--dim);width:28px;height:28px;border-radius:50%;font-size:17px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .modal-close:hover{color:var(--accent);border-color:var(--accent)}
  .modal-head{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-right:38px}
  .modal-headshot{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--chrome);
    border:2px solid var(--grid);flex:none}
  .modal-name{font-family:"Anton",sans-serif;font-size:21px;letter-spacing:.3px;line-height:1.1}
  .modal-sub{color:var(--dim);font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;font-size:12px;letter-spacing:1px;margin-top:4px}

  .tf-pills{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px}
  .tf-pill{background:#fff;color:var(--dim);border:1px solid var(--grid);border-radius:999px;
    padding:8px 15px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.3px;font-size:15px;cursor:pointer}
  .tf-pill:hover{border-color:var(--accent)}
  .tf-pill.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .scope-block{margin:2px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--grid)}
  .scope-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .scope-row:last-child{margin-bottom:0}
  .scope-since label{margin:0;color:var(--dim)}
  .scope-since input[type=date]{padding:5px 8px;font-size:13px}
  #scopeNote{margin-left:auto;font-weight:700}
  /* Sticky so the preview stays in view while you scroll splits/seasons above it. The stage is a
     true-size 1920px slice of the broadcast frame, scaled down by JS to whatever width the modal
     has — so what you see here is exactly what OBS renders, not an approximation. */
  .modal-preview-sticky{position:sticky;bottom:-20px;margin:16px -20px -20px;padding:12px 20px 20px;
    background:#fff;border-top:1px solid var(--grid);box-shadow:0 -8px 16px -8px rgba(0,0,0,.15);z-index:2}
  .modal-preview-wrap{width:100%;overflow:hidden;border-radius:6px;border:1px solid var(--hard);
    background:#123c29;margin-top:4px;position:relative}
  .modal-preview-stage{width:1920px;height:280px;position:relative;transform-origin:top left}
  .modal-preview-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#F7C600;font-family:"Sofia Sans Extra Condensed",sans-serif;text-transform:uppercase;
    letter-spacing:.5px;font-size:13px}
  .modal-export-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
  .modal-export-btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:4px;
    padding:10px 16px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.6px;font-size:13px;cursor:pointer}
  .modal-export-btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .modal-export-btn:disabled{opacity:.35;cursor:default;background:var(--chrome);color:var(--dim);border-color:var(--grid)}
  .modal-section{margin-bottom:16px}
  .modal-section h3{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;font-size:12px;letter-spacing:1.5px;color:var(--accent);margin:0 0 8px}
  .modal-section h3::before{content:"— "}
  .modal-line{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;
    color:var(--ink);margin-bottom:10px;font-weight:800}
  .modal-hitline{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;font-size:12px;color:var(--dim);margin-bottom:4px}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat-grid .cell{background:var(--chrome);border:1px solid var(--grid);border-radius:4px;
    padding:7px 4px;text-align:center}
  .stat-grid .cell .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;
    font-weight:800;color:var(--ink)}
  .stat-grid .cell .k{font-size:10px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.5px;margin-top:3px}
  .stat-grid .cell.cell-clickable{cursor:pointer}
  .stat-grid .cell.cell-clickable:hover{border-color:var(--accent)}
  .stat-grid .cell.cell-clickable:hover .v,.stat-grid .cell.cell-clickable:hover .k{color:var(--accent)}
  .modal-line .cell-clickable{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
    text-decoration-color:var(--grid)}
  .modal-line .cell-clickable:hover{color:var(--accent);text-decoration-color:var(--accent)}
  /* single-stat "sentence" graphic: one big number plus the words that go with it */
  .lt-cells-sentence{justify-content:center}
  .lt-sentence-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  .lt-sentence-line{display:flex;align-items:baseline;gap:28px;white-space:nowrap}
  .lt-sentence-line .v,.lt-sentence-line .w{font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-weight:800;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.65)}
  .lt-sentence-line .v{color:#F7C600}
  .lt-sentence-line .w{color:#F5F5F0;text-transform:uppercase;letter-spacing:.4px}
  .lt-ranknote{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;font-size:30px;
    color:#C9E7D5;text-transform:uppercase;letter-spacing:.5px;line-height:1;
    text-shadow:0 1px 4px rgba(0,0,0,.6)}
  /* side-by-side lefty/righty comparison on the bar */
  .lt-splitcompare{display:flex;align-items:center;justify-content:center;width:100%}
  .lt-splitcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
  .lt-splitcol-label{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;font-size:20px;
    color:#F7C600;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .lt-splitcol-stats{display:flex;align-items:center;justify-content:center;gap:30px;white-space:nowrap}
  .lt-splitcompare-divider{width:2px;align-self:stretch;margin:8px 30px;background:rgba(0,0,0,.35);flex:none}
  .modal-empty{color:var(--dim);font-size:13px}
  .modal-dlnote{color:var(--dim);font-size:10px;text-align:right;margin-top:8px;min-height:12px}

  /* ---- control page: on-air status chip ---- */
  .onair{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-size:12px;letter-spacing:.4px;color:var(--dim)}
  .onair-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;
    box-shadow:0 0 0 3px rgba(192,0,0,.18);animation:onair-pulse 1.6s ease-in-out infinite}
  @keyframes onair-pulse{50%{opacity:.35}}
  #onairText b{color:var(--ink);font-weight:800}
  .exit-btn{background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:4px;
    padding:5px 12px;font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;
    text-transform:uppercase;letter-spacing:.6px;font-size:11.5px;cursor:pointer}
  .exit-btn:hover{background:var(--accent);color:#fff}

  /* ---- OBS display view (?display=1) ---- */
  #lowerThirdDisplay{display:none}
  body.display-mode #lowerThirdDisplay{display:block;position:relative;width:1920px;height:1080px}
  /* always present in the DOM (it's position:absolute, so it never affects layout) — shown/hidden and
     swapped between players purely via opacity, so bringing it on, taking it off, or switching to a
     new player all get a smooth fade instead of an instant pop */
  .lt-bar{display:flex;align-items:center;gap:22px;position:absolute;left:0;right:0;bottom:60px;height:200px;
    padding:0 40px;background-color:#17AE6C;border:6px solid #F7C600;border-radius:18px;
    box-sizing:border-box; opacity:0; pointer-events:none; transition:opacity .35s ease}
  .lt-bar.lt-visible{opacity:1}
  .lt-headshot{width:150px;height:150px;border-radius:50%;object-fit:cover;background:#1A1A1A;
    border:5px solid #F7C600;flex:none}
  .lt-info{flex:none; min-width:0}
  .lt-name{font-family:"Anton",sans-serif;font-size:54px;line-height:1.05;color:#F7C600;white-space:nowrap;
    text-shadow:0 2px 6px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5)}
  .lt-sub{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;font-size:20px;
    color:#F5F5F0;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,.65)}
  .lt-divider{width:2px;align-self:stretch;margin:34px 0;background:rgba(0,0,0,.45);flex:none}
  .lt-stats{flex:1;min-width:0;text-align:center;position:relative;align-self:stretch;
    display:flex;flex-direction:column;justify-content:center}
  .lt-hitline{position:absolute;top:14px;left:0;right:0;margin:0;font-family:"Sofia Sans Extra Condensed",sans-serif;
    font-weight:700;font-size:22px;letter-spacing:.4px;text-transform:uppercase;
    text-shadow:0 1px 4px rgba(0,0,0,.65)}
  .lt-hitline .lt-splitlabel{color:#F7C600;font-weight:800}
  .lt-hitline .lt-hitcount{color:#F5F5F0}
  /* Cells are sized as a row by JS (measure, shrink to fit one line) then spread edge to edge by
     space-between — using every pixel of the bar instead of clustering in fixed 150px slots. */
  .lt-cells{display:flex;justify-content:space-between;align-items:center;width:100%;flex-wrap:nowrap}
  .lt-cells .lt-cell{text-align:center;flex:0 0 auto}
  .lt-cell .v{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;color:#F5F5F0;line-height:1;
    text-shadow:0 2px 6px rgba(0,0,0,.65)}
  .lt-cell .k{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:700;line-height:1;margin-top:2px;
    color:#F7C600;text-transform:uppercase;letter-spacing:.4px;
    text-shadow:0 1px 4px rgba(0,0,0,.6)}
  /* Real Wake N Jake donut logo, extracted straight from your show art and baked in as a data URI —
     no external asset file to lose track of. */
  .lt-brand{position:absolute;right:18px;bottom:14px;height:56px;display:flex;align-items:center}
  .lt-brand img{height:100%;width:auto;display:block}
  .lt-brand img.lt-logo-missing{display:none}
  .lt-brand-fallback{font-family:"Sofia Sans Extra Condensed",sans-serif;font-weight:800;font-size:15px;
    letter-spacing:.5px;color:#F7C600;text-transform:uppercase;white-space:nowrap;
    text-shadow:0 1px 4px rgba(0,0,0,.6)}
  body.display-mode{background:transparent}
  body.display-mode header, body.display-mode main, body.display-mode #status,
  body.display-mode .modal-backdrop{display:none}

</style>
</head>
<body>
<header>
  <div class="datanote" id="datanote">Data note: <b>Live via MLB StatsAPI</b></div>
  <div class="eyebrow">Wake N Jake</div>
  <div class="titlerow">

</header>
<div id="status">Loading…</div>
<main id="out"></main>

<script>
const API = 'https://statsapi.mlb.com/api/v1';
const j = u => fetch(u).then(r => { if(!r.ok) throw new Error(u+' → '+r.status); return r.json(); });
const jCache = new Map();
const jc = u => (jCache.has(u) ? jCache.get(u) : (jCache.set(u, j(u)), jCache.get(u)));
const $ = id => document.getElementById(id);
const el = (t, cls, txt) => { const e = document.createElement(t); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; };

// ---- control ↔ display link ----
// The OBS Browser Source runs in its own isolated browser process, so localStorage and
// BroadcastChannel (which only reach other tabs in the SAME browser) can't reach it.
// Firebase Realtime Database is the actual transport: both the control panel and the OBS
// display connect to it independently over the network, so a push here shows up there.
// This project (wnj-lowerthird) is dedicated to Wake N Jake — separate from the Talkin' Yanks
// projects — so the shows can never overwrite each other's on-air state.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCrKBxXrFEwqhNpaKJBcUJrtGZaOsPSN8A",
  authDomain: "wnj-lowerthird.firebaseapp.com",
  databaseURL: "https://wnj-lowerthird-default-rtdb.firebaseio.com",
  projectId: "wnj-lowerthird",
  storageBucket: "wnj-lowerthird.firebasestorage.app",
  messagingSenderId: "988485992681",
  appId: "1:988485992681:web:545bbaf4145e7f41573078"
};
let ltRef = null;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  ltRef = firebase.database().ref('onair');
} catch (e) {
  console.error('Firebase init failed — falling back to same-browser sync only:', e);
}

const LT_KEY = 'wnj-lower-third-onair';
const isDisplayMode = new URLSearchParams(location.search).get('display') === '1';
// kept as a same-browser fast path (and offline fallback); Firebase is what reaches OBS
const ltChannel = 'BroadcastChannel' in window ? new BroadcastChannel('wnj-lower-third') : null;
if (isDisplayMode) document.body.classList.add('display-mode');

const logoURL = id => `https://www.mlbstatic.com/team-logos/${id}.svg`;
const headshotURL = pid =>
  `https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png,q_auto:best,f_auto/v1/people/${pid}/headshot/67/current`;

function say(msg, isErr) { $('status').textContent = msg || ''; $('status').className = isErr ? 'err' : ''; }

// =====================================================================================
// Teams / divisions / global player index
// =====================================================================================

let teamsById = new Map();       // id -> team object {id,name,abbreviation,division,league}
let divisions = [];              // [{league, name, short, teams:[...]}] in display order
let allPlayers = [];             // full-season player index for global search
let currentTeamId = null;
let currentView = 'directory';   // 'directory' | 'roster' | 'search'
let browseMode = 'teams';        // 'teams' | 'positions' | 'all' — how the landing page is organized
let posFilter = '';              // position code; narrows every view (directory, roster, search)

const divShort = name => (name || '').replace('American League', 'AL').replace('National League', 'NL');

async function loadTeams(year) {
  const d = await j(`${API}/teams?sportId=1&season=${year}&activeStatus=Yes`);
  const teams = (d.teams || []).filter(t => t.division && t.league);
  teamsById = new Map(teams.map(t => [t.id, t]));

  const byDiv = new Map();
  teams.forEach(t => {
    const key = t.division.id;
    if (!byDiv.has(key)) byDiv.set(key, { id: key, league: t.league.name, name: t.division.name, short: divShort(t.division.name), teams: [] });
    byDiv.get(key).teams.push(t);
  });
  divisions = [...byDiv.values()].sort((a, b) => a.league.localeCompare(b.league) || a.name.localeCompare(b.name));
  divisions.forEach(dv => dv.teams.sort((a, b) => a.name.localeCompare(b.name)));

  $('division').innerHTML = '<option value="">All Divisions</option>' +
    divisions.map(dv => `<option value="${dv.short}">${dv.short}</option>`).join('');
  populateTeamSelect();
}

function populateTeamSelect(divShortFilter) {
  const list = divShortFilter ? divisions.filter(dv => dv.short === divShortFilter) : divisions;
  const opts = list.map(dv =>
    `<optgroup label="${dv.short}">` +
    dv.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('') +
    `</optgroup>`).join('');
  $('team').innerHTML = '<option value="">Select a team…</option>' + opts;
}

async function loadPlayerIndex(year) {
  const d = await j(`${API}/sports/1/players?season=${year}`);
  allPlayers = (d.people || []).map(p => ({
    id: p.id, name: p.fullName, pos: (p.primaryPosition && p.primaryPosition.abbreviation) || '',
    number: p.primaryNumber || '', teamId: p.currentTeam ? p.currentTeam.id : null,
    teamName: p.currentTeam ? p.currentTeam.name : '',
  })).filter(p => p.teamId);
}

// currentTeam frequently comes back with an id but no name, so always resolve the display name
// from the teams map (which is authoritative) and fall back to whatever the index carried.
function teamNameFor(p) {
  const t = teamsById.get(p.teamId);
  return (t && t.name) || p.teamName || '';
}

function setTeamBadge(team) {
  const box = $('teambadge');
  if (!team) { box.innerHTML = ''; return; }
  box.innerHTML = `<img src="${logoURL(team.id)}" alt="${team.name}" onerror="this.remove()">` +
    `<span class="tn">${team.name}</span>`;
}

// =====================================================================================
// Directory (default browse view) — every team, grouped by league/division
// =====================================================================================

// Positions are grouped for browsing rather than listed flat, so the landing page reads like a
// lineup card instead of an alphabet soup of codes. Buckets are derived from whatever positions
// actually appear in the season's player index, so nothing shows up empty.
const POS_BUCKETS = [
  ['Infield', ['C', '1B', '2B', '3B', 'SS']],
  ['Outfield', ['LF', 'CF', 'RF', 'OF']],
  ['Pitching', ['P', 'SP', 'RP']],
  ['Other', ['DH', 'TWP']],
];
const POS_FULL = { C:'Catcher','1B':'First Base','2B':'Second Base','3B':'Third Base',SS:'Shortstop',
  LF:'Left Field',CF:'Center Field',RF:'Right Field',OF:'Outfield',DH:'Designated Hitter',
  P:'Pitcher',SP:'Starting Pitcher',RP:'Relief Pitcher',TWP:'Two-Way Player' };

// players matching the active division filter (position filter applied separately by each caller)
function playersInScope(divShortFilter) {
  if (!divShortFilter) return allPlayers;
  const dv = divisions.find(d => d.short === divShortFilter);
  if (!dv) return allPlayers;
  const ids = new Set(dv.teams.map(t => t.id));
  return allPlayers.filter(p => ids.has(p.teamId));
}

function positionCounts(divShortFilter) {
  const counts = new Map();
  playersInScope(divShortFilter).forEach(p => counts.set(p.pos, (counts.get(p.pos) || 0) + 1));
  return counts;
}

function populatePositionSelect(divShortFilter) {
  const counts = positionCounts(divShortFilter);
  const opts = POS_BUCKETS.map(([label, codes]) => {
    const avail = codes.filter(c => counts.get(c));
    if (!avail.length) return '';
    return `<optgroup label="${label}">` +
      avail.map(c => `<option value="${c}">${c} — ${POS_FULL[c] || c} (${counts.get(c)})</option>`).join('') +
      `</optgroup>`;
  }).join('');
  const sel = $('position');
  const keep = sel.value;
  sel.innerHTML = '<option value="">All Positions</option>' + opts;
  sel.value = keep;
  if (sel.value !== keep) { posFilter = ''; }
}

function renderPositionDirectory(divShortFilter) {
  currentView = 'directory';
  setTeamBadge(null);
  const out = $('out'); out.innerHTML = ''; say('');
  const counts = positionCounts(divShortFilter);
  POS_BUCKETS.forEach(([label, codes]) => {
    const avail = codes.filter(c => counts.get(c));
    if (!avail.length) return;
    out.appendChild(el('div', 'poshead', label));
    const grid = el('div', 'team-grid');
    avail.forEach(c => {
      const card = el('button', 'team-card'); card.type = 'button';
      card.innerHTML = `<span class="tname">${c} · ${POS_FULL[c] || c}</span>` +
                       `<span class="tcount">${counts.get(c)}</span>`;
      card.onclick = () => { $('position').value = c; posFilter = c; renderPositionResults(c); };
      grid.appendChild(card);
    });
    out.appendChild(grid);
  });
}

// Any filtered set of players, grouped by team and sortable — shared by position browsing,
// "all players", and name search so all three behave identically.
function renderPlayerList(title, players, noteWhenEmpty) {
  currentView = 'search';
  setTeamBadge(null);
  say('');
  if (!players.length) { searchState = null; addTable(title, null, noteWhenEmpty || 'No players matched.'); return; }
  const LIMIT = 400;
  const shown = players.slice(0, LIMIT);
  const byTeam = new Map();
  shown.forEach(p => { if (!byTeam.has(p.teamId)) byTeam.set(p.teamId, []); byTeam.get(p.teamId).push(p); });
  const teamGroups = [...byTeam.entries()]
    .map(([tid, ps]) => ({ team: teamsById.get(tid), players: ps }))
    .sort((a, b) => (a.team ? a.team.name : '').localeCompare(b.team ? b.team.name : ''));
  searchState = { query: title, title, teamGroups, total: players.length, limit: LIMIT };
  sortState = { table: 'search', key: null, dir: 1 };
  paintSearch();
}

function renderPositionResults(pos) {
  const dv = $('division').value;
  const list = playersInScope(dv).filter(p => p.pos === pos)
    .sort((a, b) => a.name.localeCompare(b.name));
  renderPlayerList(`${pos} — ${POS_FULL[pos] || pos}${dv ? ' · ' + dv : ''}`, list,
    'No players at that position in this scope.');
}

function renderAllPlayers(divShortFilter) {
  let list = playersInScope(divShortFilter);
  if (posFilter) list = list.filter(p => p.pos === posFilter);
  list = [...list].sort((a, b) => a.name.localeCompare(b.name));
  const bits = [posFilter || 'All Players', divShortFilter].filter(Boolean).join(' · ');
  renderPlayerList(bits, list);
}

// Single entry point every control routes through, so the landing view always reflects the
// current browse mode + division + position together instead of each control fighting the others.
function renderLanding() {
  const dv = $('division').value;
  populatePositionSelect(dv);
  if (browseMode === 'positions') {
    if (posFilter) renderPositionResults(posFilter);
    else renderPositionDirectory(dv);
  } else if (browseMode === 'all') {
    renderAllPlayers(dv);
  } else {
    if (posFilter) renderPositionResults(posFilter);
    else renderDirectory(dv);
  }
}

// Standings power the Baseball-Reference-style view. One request covers both leagues; cached per
// season so flipping between browse modes doesn't refetch.
let standingsCache = new Map();
async function loadStandings(year) {
  if (standingsCache.has(year)) return standingsCache.get(year);
  const p = (async () => {
    const d = await jc(`${API}/standings?leagueId=103,104&season=${year}&standingsTypes=regularSeason`);
    const byDiv = new Map();
    (d.records || []).forEach(rec => {
      const divId = rec.division && rec.division.id;
      byDiv.set(divId, (rec.teamRecords || []).map(tr => ({
        id: tr.team.id,
        name: tr.team.name,
        w: tr.wins, l: tr.losses,
        gb: tr.gamesBack,
        pct: tr.winningPercentage,
      })));
    });
    return byDiv;
  })().catch(() => null);
  standingsCache.set(year, p);
  return p;
}

// Abbreviations come from the teams payload; fall back to a name-derived stub if one is missing
// so a team can never silently vanish from the bar.
const abbrOf = t => t.abbreviation || t.teamCode || (t.name || '').slice(0, 3).toUpperCase();

function renderAbbrBar(container) {
  const bar = el('div', 'abbrbar');
  ['American League', 'National League'].forEach(lg => {
    const teams = [...teamsById.values()].filter(t => t.league && t.league.name === lg)
      .sort((a, b) => abbrOf(a).localeCompare(abbrOf(b)));
    if (!teams.length) return;
    bar.appendChild(el('div', 'lg', lg));
    const row = el('div', 'row');
    teams.forEach(t => {
      const b = el('button', null, abbrOf(t));
      b.type = 'button'; b.title = t.name;
      b.onclick = () => { $('team').value = t.id; guard(loadRoster)(t.id); };
      row.appendChild(b);
    });
    bar.appendChild(row);
  });
  container.appendChild(bar);
}

// Division order within each league, so the tables read the way they do on Baseball Reference.
const DIV_ORDER = ['East', 'Central', 'West'];
const divSuffix = name => (name || '').split(' ').pop();

async function renderStandings(container, divShortFilter) {
  const year = $('season').value;
  const note = el('div', 'metanote', 'Loading standings\u2026');
  container.appendChild(note);
  const byDiv = await loadStandings(year);
  note.remove();
  if (!byDiv || !byDiv.size) {
    // standings unavailable (e.g. a season that never started) — the abbreviation bar above still works
    container.appendChild(el('div', 'metanote', 'Standings unavailable for this season.'));
    return;
  }
  const wrap = el('div', 'stand-wrap');
  ['American League', 'National League'].forEach(lg => {
    const divs = divisions.filter(dv => dv.league === lg)
      .sort((a, b) => DIV_ORDER.indexOf(divSuffix(a.name)) - DIV_ORDER.indexOf(divSuffix(b.name)));
    const shown = divShortFilter ? divs.filter(dv => dv.short === divShortFilter) : divs;
    if (!shown.length) return;
    const box = el('div', 'stand');
    const table = el('table');
    table.innerHTML = `<thead><tr><th>${lg === 'American League' ? 'AL' : 'NL'}</th>` +
      `<th>W</th><th>L</th><th>PCT</th><th>GB</th></tr></thead>`;
    const tb = el('tbody');
    shown.forEach(dv => {
      const rows = byDiv.get(dv.id) || [];
      const trD = el('tr', 'divrow');
      const tdD = el('td', null, divSuffix(dv.name)); tdD.colSpan = 5;
      trD.appendChild(tdD); tb.appendChild(trD);
      rows.forEach(r => {
        const tr = el('tr', 'teamrow');
        tr.onclick = () => { $('team').value = r.id; guard(loadRoster)(r.id); };
        const tdName = el('td'); tdName.innerHTML = `<span class="tlink">${r.name}</span>`;
        tr.appendChild(tdName);
        [r.w, r.l, r.pct, r.gb].forEach(v => tr.appendChild(el('td', 'num', v == null ? '\u2014' : String(v))));
        tb.appendChild(tr);
      });
    });
    table.appendChild(tb); box.appendChild(table); wrap.appendChild(box);
  });
  container.appendChild(wrap);
}

// Two ways into a team, stacked: a compact alphabetical bar of every club (fast if you already
// know the abbreviation) and, below it, the same 30 teams laid out by current standings — which is
// how most people actually picture the league.
function renderDirectory(divShortFilter) {
  currentView = 'directory';
  setTeamBadge(null);
  const out = $('out'); out.innerHTML = '';
  say('');
  renderAbbrBar(out);
  out.appendChild(el('h2', null, `Standings \u2014 ${$('season').value}`));
  const standBox = el('div');
  out.appendChild(standBox);
  // async so the abbreviation bar is usable immediately rather than waiting on the standings call
  renderStandings(standBox, divShortFilter).catch(() => {
    standBox.appendChild(el('div', 'metanote', 'Standings unavailable right now.'));
  });
}

// =====================================================================================
// Roster — active / injured list / 40-man reserve, grouped, click a name to open the modal
// =====================================================================================

const POS_ORDER = { C:1, '1B':2, '2B':3, '3B':4, SS:5, LF:6, CF:7, RF:8, OF:9, DH:10, SP:11, RP:12, P:13, TWP:14 };
const posRank = p => POS_ORDER[p] ?? 50;

function classifyStatus(entry) {
  const code = entry.status && entry.status.code;
  const desc = (entry.status && entry.status.description) || '';
  if (code === 'A') return 'active';
  if (/IL|DL/i.test(desc) || /^D/.test(code || '')) return 'il';
  return 'res';
}

async function loadRoster(teamId) {
  currentTeamId = teamId; currentView = 'roster';
  const team = teamsById.get(+teamId);
  const y = $('season').value;
  setTeamBadge(team);
  $('find').value = '';
  say('Loading roster…');
  let roster = [];
  try {
    const d = await j(`${API}/teams/${teamId}/roster?rosterType=40Man&season=${y}`);
    roster = d.roster || [];
  } catch (e) { /* fall through to active */ }
  if (!roster.length) {
    try {
      const d = await j(`${API}/teams/${teamId}/roster?rosterType=active&season=${y}`);
      roster = (d.roster || []).map(r => ({ ...r, status: r.status || { code: 'A', description: 'Active' } }));
    } catch (e) { say('Could not load that roster: ' + e.message, true); return; }
  }
  say('');
  rosterState = {
    team, year: y,
    rows: roster.map(r => ({
      id: r.person.id, name: r.person.fullName, pos: (r.position && r.position.abbreviation) || '',
      number: r.jerseyNumber || '', group: classifyStatus(r),
    })),
  };
  sortState = { table: 'roster', key: null, dir: 1 };
  paintRoster();
}

// numbers sort numerically (blank last); everything else sorts as case-insensitive text
function sortRows(rows, key, dir) {
  if (!key) return rows;
  return [...rows].sort((a, b) => {
    let av = a[key], bv = b[key];
    if (key === 'number') {
      av = av === '' || av == null ? null : +av; bv = bv === '' || bv == null ? null : +bv;
      if (av === null && bv === null) return 0;
      if (av === null) return 1; if (bv === null) return -1;
      return (av - bv) * dir;
    }
    if (key === 'teamName') { av = teamNameFor(a); bv = teamNameFor(b); }
    av = (av || '').toString().toLowerCase(); bv = (bv || '').toString().toLowerCase();
    if (av < bv) return -1 * dir; if (av > bv) return 1 * dir; return 0;
  });
}

// stamp a header cell as sortable and light it up if it's the active sort column

// =====================================================================================
// Player modal — timeframe pills (Full Season / Last 7 / 14 / 30 days), hitting + pitching

// Same split set as the other Wake N Jake / Talkin' Yanks lower-third tools.
const TF = [
  ['season', 'FULL SEASON'],
  ['career', 'CAREER'],
  ['l7', 'LAST WEEK'],
  ['l14', 'LAST 2 WEEKS'],
  ['l30', 'LAST 30 DAYS'],
  ['month', 'THIS MONTH'],
  ['2h', 'SECOND HALF'],
  ['vl', 'VS LHP'],
  ['vr', 'VS RHP'],
  ['home', 'HOME'],
  ['away', 'ROAD'],
];
// Career is all seasons by definition, so the season chips don't apply to it.
const isCareerTf = tf => tf === 'career';

// Career-scoped situational splits — MLB's careerStatSplits stat type. Separate from the
// season-scoped vs LHP/RHP and Home/Road above, which only cover the selected season(s).
const CAREER_SPLITS = [
  ['careervl', 'CAREER VS LHP', 'vl'],
  ['careervr', 'CAREER VS RHP', 'vr'],
  ['careerhome', 'CAREER HOME', 'h'],
  ['careeraway', 'CAREER ROAD', 'a'],
];
const CAREER_SPLIT_SIT = Object.fromEntries(CAREER_SPLITS.map(([k, , sit]) => [k, sit]));
const CAREER_SPLIT_NAME = Object.fromEntries(CAREER_SPLITS.map(([k, label]) => [k, label]));
const isCareerSplit = tf => !!CAREER_SPLIT_SIT[tf];
// keys that carry their own parameters rather than being a fixed button
const isRangeTf = tf => typeof tf === 'string' && tf.startsWith('range:');
const isLastXTf = tf => typeof tf === 'string' && tf.startsWith('lastx:');
const isSplitTf = tf => tf === 'vl' || tf === 'vr';
let modalPid = null, modalRow = null, modalTf = 'season';
let modalBat = null, modalPit = null;  // currently-loaded stat objects for the active timeframe

// K% (strikeout rate) isn't a field the API hands back pre-computed, but every stat shape we use —
// season, byDateRange, and the vs-L/R splits — carries the raw counts to derive it ourselves.
const kPct = (k, denom) => denom ? Math.round(k / denom * 100) + '%' : '—';
const bbPct = (bb, denom) => denom ? Math.round(bb / denom * 100) + '%' : '—';

// Clicking a stat should put a plain-English sentence on screen ("9 HOME RUNS THIS SEASON"), so
// every clickable stat needs singular/plural words. Anything not in here simply isn't clickable.
const TILE_WORDS = {
  HR: ['home run', 'home runs'], RBI: ['RBI', 'RBI'], BB: ['walk', 'walks'],
  K: ['strikeout', 'strikeouts'], SB: ['stolen base', 'stolen bases'],
  HBP: ['hit by pitch', 'hit by pitch'], H: ['hit', 'hits'], R: ['run', 'runs'],
  ER: ['earned run', 'earned runs'], SV: ['save', 'saves'], G: ['game', 'games'],
  IP: ['inning pitched', 'innings pitched'], W: ['win', 'wins'], L: ['loss', 'losses'],
  // rate stats read the same either way \u2014 they're never a count of anything
  AVG: ['batting average', 'batting average'], OBP: ['on-base percentage', 'on-base percentage'],
  SLG: ['slugging percentage', 'slugging percentage'], OPS: ['OPS', 'OPS'],
  ERA: ['ERA', 'ERA'], WHIP: ['WHIP', 'WHIP'], BAA: ['batting average against', 'batting average against'],
  'K%': ['strikeout rate', 'strikeout rate'], 'BB%': ['walk rate', 'walk rate'],
};

// data-source is whatever scope produced the number, so the sentence can say "this season",
// "in his career", or the exact split that was on screen when it was clicked.
function statGrid(pairs, source, group) {
  const DASH = '\u2013', EMDASH = '\u2014';
  return `<div class="stat-grid">` + pairs.map(([k, v]) => {
    const clickable = source && TILE_WORDS[k] && v != null && v !== '' && v !== DASH && v !== EMDASH;
    const attrs = clickable
      ? ` data-source="${encodeURIComponent(source)}" data-label="${k}" data-value="${v}" data-group="${group || ''}"`
      : '';
    return `<div class="cell${clickable ? ' cell-clickable' : ''}"${attrs}>` +
      `<div class="v">${v != null && v !== '' ? v : DASH}</div><div class="k">${k}</div></div>`;
  }).join('') + `</div>`;
}

// AVG/OBP/SLG/OPS as four individually clickable values, same mechanism as the tiles below.
function rateLine(rates, source) {
  const labels = ['AVG', 'OBP', 'SLG', 'OPS'];
  const parts = labels.map((label, i) =>
    `<span class="cell-clickable" data-source="${encodeURIComponent(source)}" data-label="${label}" data-value="${rates[i]}" data-group="hitting">${rates[i]}</span>`);
  return `<div class="modal-line">${parts.join(' / ')} <span style="color:var(--dim);font-weight:400">AVG/OBP/SLG/OPS</span></div>`;
}

// splitKey shape: stat:<encoded source>:<label>:<value>
function buildStatTileGraphicData(splitKey) {
  const parts = splitKey.split(':');
  const source = decodeURIComponent(parts[1]), label = parts[2], rawValue = parts.slice(3).join(':');
  const words = TILE_WORDS[label];
  if (!words) return null;
  const n = parseFloat(rawValue);
  const word = Math.abs(n) === 1 ? words[0] : words[1];
  const cellLabel = `${word} ${source}`.trim().toUpperCase();
  return { label: `${rawValue} ${word} ${source}`.trim(), splitLabel: '', sentenceMode: true,
           cells: [[cellLabel, rawValue]] };
}
function apiBattingBlock(st, source) {
  if (!st) return `<div class="modal-empty">No hitting stats for this range.</div>`;
  const cells = [['HR', st.homeRuns], ['RBI', st.rbi], ['BB', st.baseOnBalls],
                 ['K', st.strikeOuts], ['SB', st.stolenBases], ['HBP', st.hitByPitch],
                 ['K%', kPct(st.strikeOuts, st.plateAppearances)],
                 ['BB%', bbPct(st.baseOnBalls, st.plateAppearances)]];
  return `<div class="modal-hitline">${st.hits}-for-${st.atBats}</div>`
    + rateLine([st.avg, st.obp, st.slg, st.ops], source)
    + statGrid(cells, source, 'hitting');
}
function apiPitchingBlock(st, source) {
  if (!st) return `<div class="modal-empty">No pitching stats for this range.</div>`;
  return `<div class="modal-line">${st.inningsPitched} IP \u00b7 ${st.era} ERA \u00b7 ${st.wins}-${st.losses}</div>`
    + statGrid([['IP', st.inningsPitched], ['ERA', st.era], ['WHIP', st.whip], ['K', st.strikeOuts],
                ['BB', st.baseOnBalls], ['SV', st.saves], ['ER', st.earnedRuns],
                ['K%', kPct(st.strikeOuts, st.battersFaced)]], source, 'pitching');
}
// vs-lefties/vs-righties pitching splits come back as a "batters faced" line, not a game record —
// no ERA, no W-L, no saves (those aren't a real concept split by opposing-batter handedness).
function apiPitchingSplitBlock(st, source) {
  if (!st) return `<div class="modal-empty">No pitching stats for this range.</div>`;
  return `<div class="modal-hitline">${st.hits}-for-${st.atBats} allowed</div>`
    + `<div class="modal-line">${st.inningsPitched} IP \u00b7 ${st.whip} WHIP \u00b7 ${st.avg} BAA</div>`
    + statGrid([['IP', st.inningsPitched], ['WHIP', st.whip], ['BAA', st.avg], ['K', st.strikeOuts],
                ['BB', st.baseOnBalls], ['HR', st.homeRuns],
                ['K%', kPct(st.strikeOuts, st.battersFaced)]], source, 'pitching');
}

function dateRangeFor(key) {
  const end = new Date(), fmt = d => d.toISOString().slice(0, 10);
  const start = new Date(end);
  if (key === 'l7') start.setDate(start.getDate() - 7);
  else if (key === 'l14') start.setDate(start.getDate() - 14);
  else if (key === 'l30') start.setDate(start.getDate() - 30);
  else if (key === 'month') start.setDate(1);
  return { startDate: fmt(start), endDate: fmt(end) };
}
// group is 'hitting' | 'pitching' | omitted — the vs-L/R label reads differently depending on
// which side of the ball it's describing (a hitter faces LHP, a pitcher faces LHB)
function tfLabel(tf, year, group) {
  if (tf === 'season') return `${year} SEASON`;
  if (tf === 'vl') return group === 'pitching' ? 'VS LHB' : 'VS LHP';
  if (tf === 'vr') return group === 'pitching' ? 'VS RHB' : 'VS RHP';
  const found = TF.find(([k]) => k === tf);
  return found ? found[1] : String(tf).toUpperCase();
}

// MLB has no "since the All-Star break" stat type — the sinceLastAllStarGame value this used to
// send is not valid and errored on every request, which is why that split never returned anything.
// The working approach is to look up the season's actual All-Star Game date and run a plain date
// range from the day after. Cached per season, so it costs one extra request at most.
const asbCache = new Map();
async function getSecondHalfStart(year) {
  if (asbCache.has(year)) return asbCache.get(year);
  const p = (async () => {
    const d = await jc(`${API}/schedule?sportId=1&gameTypes=A&season=${year}`).catch(() => null);
    const dates = ((d && d.dates) || []).map(x => x.date).sort();
    if (!dates.length) return null;   // no All-Star Game that season (or it hasn't happened yet)
    const start = new Date(dates[dates.length - 1] + 'T12:00');  // Derby/Futures come first, take the last
    start.setDate(start.getDate() + 1);
    return start.toISOString().slice(0, 10);
  })();
  asbCache.set(year, p);
  return p;
}

async function fetchStat(pid, group, tf, year) {
  const base = `${API}/people/${pid}/stats?season=${year}&group=${group}`;
  let url;
  if (tf === 'season') url = `${base}&stats=season`;
  else if (tf === 'career') url = `${API}/people/${pid}/stats?stats=career&group=${group}&sportId=1`;
  else if (isSplitTf(tf)) url = `${base}&stats=statSplits&sitCodes=${tf}`;
  else if (tf === 'home' || tf === 'away') url = `${base}&stats=statSplits&sitCodes=${tf === 'home' ? 'h' : 'a'}`;
  else if (tf === '2h') {
    const start = await getSecondHalfStart(year);
    if (!start) return null;
    url = `${base}&stats=byDateRange&startDate=${start}&endDate=${new Date().toISOString().slice(0, 10)}`;
  }
  else {
    const { startDate, endDate } = dateRangeFor(tf);
    url = `${base}&stats=byDateRange&startDate=${startDate}&endDate=${endDate}`;
  }
  const d = await jc(url);
  const sec = (d.stats || [])[0];
  return sec && sec.splits && sec.splits.length ? sec.splits[0].stat : null;
}

function wantsBatting(row) { return row.pos !== 'P'; }
function wantsPitching(row) { return row.pos === 'P' || row.pos === 'TWP'; }

// =====================================================================================
// Season scope — which season(s) the split is measured over. Any combination of seasons can be
// checked, and a custom "since" date can span them. Multi-season figures are aggregated from raw
// counting stats (never by averaging rates, which would be wrong for unequal playing time).
// =====================================================================================

let modalSeasons = new Set();   // years selected in the modal
let modalSince = '';            // YYYY-MM-DD, '' when not in use
let modalRangeFrom = '', modalRangeTo = '';   // explicit start/end range
let modalLastX = 0;             // last N games
let modalSeasonList = [];       // every season this player has MLB stats for

const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
// inningsPitched comes back as "62.1" meaning 62 innings + 1 out, so it can't be summed as a
// float; outs is the only safe unit to add. Fall back to parsing IP when outs is absent.
function outsOf(st) {
  if (st.outs != null) return num(st.outs);
  const ip = String(st.inningsPitched || '0'); const [w, f] = ip.split('.');
  return num(w) * 3 + num(f || 0);
}
const ipFromOuts = o => `${Math.floor(o / 3)}.${o % 3}`;
const fmt3 = v => (isFinite(v) ? v.toFixed(3).replace(/^0\./, '.') : '.000');

async function fetchSeasonList(pid, groups) {
  const years = new Set();
  await Promise.all(groups.map(async g => {
    try {
      const d = await jc(`${API}/people/${pid}/stats?stats=yearByYear&group=${g}`);
      ((d.stats || [])[0]?.splits || []).forEach(sp => { if (sp.season) years.add(String(sp.season)); });
    } catch {}
  }));
  return [...years].sort((a, b) => b.localeCompare(a));
}

function aggregateBatting(list) {
  const parts = list.filter(Boolean);
  if (!parts.length) return null;
  if (parts.length === 1) return parts[0];
  const sum = k => parts.reduce((a, st) => a + num(st[k]), 0);
  const h = sum('hits'), ab = sum('atBats'), bb = sum('baseOnBalls'), hbp = sum('hitByPitch'),
        sf = sum('sacFlies'), tb = sum('totalBases'), pa = sum('plateAppearances');
  const obpDen = ab + bb + hbp + sf;
  const obp = obpDen ? (h + bb + hbp) / obpDen : 0, slg = ab ? tb / ab : 0;
  return {
    hits: h, atBats: ab, baseOnBalls: bb, hitByPitch: hbp, sacFlies: sf, totalBases: tb,
    plateAppearances: pa, strikeOuts: sum('strikeOuts'), homeRuns: sum('homeRuns'),
    rbi: sum('rbi'), stolenBases: sum('stolenBases'), gamesPlayed: sum('gamesPlayed'),
    avg: fmt3(ab ? h / ab : 0), obp: fmt3(obp), slg: fmt3(slg), ops: fmt3(obp + slg),
  };
}

function aggregatePitching(list) {
  const parts = list.filter(Boolean);
  if (!parts.length) return null;
  if (parts.length === 1) return parts[0];
  const sum = k => parts.reduce((a, st) => a + num(st[k]), 0);
  const outs = parts.reduce((a, st) => a + outsOf(st), 0);
  const ip = outs / 3, er = sum('earnedRuns'), bb = sum('baseOnBalls'), h = sum('hits');
  const ab = sum('atBats');
  return {
    outs, inningsPitched: ipFromOuts(outs), earnedRuns: er, baseOnBalls: bb, hits: h, atBats: ab,
    strikeOuts: sum('strikeOuts'), battersFaced: sum('battersFaced'), homeRuns: sum('homeRuns'),
    wins: sum('wins'), losses: sum('losses'), saves: sum('saves'), gamesPlayed: sum('gamesPlayed'),
    gamesStarted: sum('gamesStarted'),
    era: ip ? (er * 9 / ip).toFixed(2) : '\u2014',
    whip: ip ? ((bb + h) / ip).toFixed(2) : '\u2014',
    avg: fmt3(ab ? h / ab : 0),
  };
}

const aggregateFor = (group, list) => group === 'pitching' ? aggregatePitching(list) : aggregateBatting(list);

// A "since" date can reach back through several seasons, and the MLB API only answers one season
// at a time — so ask each season separately for its slice and add the pieces together.
async function fetchSince(pid, group, sinceDate) {
  const startYear = +sinceDate.slice(0, 4), endYear = +($('season').value || new Date().getFullYear());
  const today = new Date().toISOString().slice(0, 10);
  const years = [];
  for (let y = startYear; y <= endYear; y++) years.push(y);
  const parts = await Promise.all(years.map(async y => {
    const start = y === startYear ? sinceDate : `${y}-01-01`;
    const end = y === endYear ? today : `${y}-12-31`;
    try {
      const d = await jc(`${API}/people/${pid}/stats?season=${y}&group=${group}&stats=byDateRange&startDate=${start}&endDate=${end}`);
      const sec = (d.stats || [])[0];
      return sec && sec.splits && sec.splits.length ? sec.splits[0].stat : null;
    } catch { return null; }
  }));
  return aggregateFor(group, parts);
}

// Runs the active split across every selected season and aggregates the results.
// Any start date through any end date, spanning seasons the same way the since-date does.
async function fetchRange(pid, group, from, to) {
  const y0 = +from.slice(0, 4), y1 = +to.slice(0, 4);
  const years = [];
  for (let y = y0; y <= y1; y++) years.push(y);
  const parts = await Promise.all(years.map(async y => {
    const start = y === y0 ? from : `${y}-01-01`;
    const end = y === y1 ? to : `${y}-12-31`;
    try {
      const d = await jc(`${API}/people/${pid}/stats?season=${y}&group=${group}&stats=byDateRange&startDate=${start}&endDate=${end}`);
      const sec = (d.stats || [])[0];
      return sec && sec.splits && sec.splits.length ? sec.splits[0].stat : null;
    } catch { return null; }
  }));
  return aggregateFor(group, parts);
}

async function fetchCareerSplit(pid, group, tf) {
  const sit = CAREER_SPLIT_SIT[tf];
  const d = await jc(`${API}/people/${pid}/stats?stats=careerStatSplits&sitCodes=${sit}&group=${group}&sportId=1`);
  const sec = (d.stats || [])[0];
  return sec && sec.splits && sec.splits.length ? sec.splits[0].stat : null;
}

async function fetchLastX(pid, group, n) {
  const d = await jc(`${API}/people/${pid}/stats?stats=lastXGames&limit=${n}&group=${group}&sportId=1`);
  const sec = (d.stats || [])[0];
  return sec && sec.splits && sec.splits.length ? sec.splits[0].stat : null;
}
